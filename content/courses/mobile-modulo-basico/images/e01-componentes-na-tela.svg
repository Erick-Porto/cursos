<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Inter, system-ui, sans-serif">
  <title>A tela do Minhas Tarefas dividida em componentes: App contém Cabecalho, ListaTarefas e Rodape, e ListaTarefas contém três CartaoTarefa</title>
  <style>
    .page { fill: #131c33; stroke: #a78bfa; stroke-width: 2; stroke-dasharray: 8 6; }
    .reg  { fill: #0b1020; stroke: #a78bfa; stroke-width: 2; stroke-dasharray: 8 6; }
    .card { fill: #131c33; stroke: #a78bfa; stroke-width: 2; stroke-dasharray: 8 6; }
    .bar  { fill: #2a3a5c; }
    .comp { fill: #a78bfa; font-size: 22px; font-weight: 700; font-family: 'JetBrains Mono', Consolas, monospace; }
    .titulo { fill: #e8edf7; font-size: 24px; font-weight: 700; }
  </style>
  <rect width="720" height="380" rx="16" fill="#0b1020"/>

  <!-- App -->
  <rect class="page" x="20" y="20" width="680" height="340" rx="12"/>
  <text class="comp" x="40" y="52">App</text>

  <!-- Cabecalho -->
  <rect class="reg" x="40" y="66" width="640" height="58" rx="8"/>
  <text class="titulo" x="60" y="104">Minhas Tarefas</text>
  <text class="comp" x="660" y="103" text-anchor="end">Cabecalho</text>

  <!-- ListaTarefas com três CartaoTarefa -->
  <rect class="reg" x="40" y="138" width="640" height="150" rx="8"/>
  <text class="comp" x="60" y="170">ListaTarefas</text>

  <rect class="card" x="60" y="186" width="190" height="86" rx="8"/>
  <text class="comp" x="76" y="218">CartaoTarefa</text>
  <rect class="bar" x="76" y="240" width="140" height="14" rx="7"/>

  <rect class="card" x="265" y="186" width="190" height="86" rx="8"/>
  <text class="comp" x="281" y="218">CartaoTarefa</text>
  <rect class="bar" x="281" y="240" width="110" height="14" rx="7"/>

  <rect class="card" x="470" y="186" width="190" height="86" rx="8"/>
  <text class="comp" x="486" y="218">CartaoTarefa</text>
  <rect class="bar" x="486" y="240" width="125" height="14" rx="7"/>

  <!-- Rodape -->
  <rect class="reg" x="40" y="302" width="640" height="44" rx="8"/>
  <rect class="bar" x="60" y="317" width="220" height="14" rx="7"/>
  <text class="comp" x="660" y="332" text-anchor="end">Rodape</text>
</svg>
