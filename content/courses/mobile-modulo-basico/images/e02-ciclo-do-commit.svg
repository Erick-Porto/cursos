<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Inter, system-ui, sans-serif">
  <title>Do arquivo editado ao commit: git add . marca o arquivo para o commit e git commit -m tira a fotografia, que entra no histórico</title>
  <style>
    .box  { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .hd   { fill: #e8edf7; font-size: 22px; font-weight: 700; }
    .sub  { fill: #b4bfd3; font-size: 22px; }
    .code { font-size: 22px; font-family: 'JetBrains Mono', Consolas, monospace; }
    .file { fill: #e8edf7; }
    .cmd  { fill: #a78bfa; font-weight: 700; }
    .chip { fill: #0b1020; stroke-width: 2; }
    .ed   { stroke: #fbbf24; }
    .mk   { stroke: #34d399; }
    .ph   { stroke: #a78bfa; }
    .msg  { fill: #e8edf7; font-size: 22px; }
    .cap  { font-size: 22px; font-weight: 700; }
    .link { stroke: #a78bfa; stroke-width: 2.5; fill: none; marker-end: url(#seta); }
    .s1 { animation: liga1 8s infinite; }
    .c1 { animation: chega1 8s infinite; }
    .s2 { animation: liga2 8s infinite; }
    .c2 { animation: chega2 8s infinite; }
    @keyframes liga1 {
      0%, 10%  { opacity: 0; }
      18%, 90% { opacity: 1; }
      97%, 100% { opacity: 0; }
    }
    @keyframes chega1 {
      0%, 16%  { opacity: 0; transform: translateX(-60px); }
      30%, 90% { opacity: 1; transform: translateX(0); }
      97%, 100% { opacity: 0; transform: translateX(0); }
    }
    @keyframes liga2 {
      0%, 42%  { opacity: 0; }
      50%, 90% { opacity: 1; }
      97%, 100% { opacity: 0; }
    }
    @keyframes chega2 {
      0%, 48%  { opacity: 0; transform: translateX(-60px); }
      62%, 90% { opacity: 1; transform: translateX(0); }
      97%, 100% { opacity: 0; transform: translateX(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .s1, .c1, .s2, .c2 { animation: none; }
    }
  </style>
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
  </defs>
  <rect width="720" height="300" rx="16" fill="#0b1020"/>

  <!-- pasta do projeto -->
  <rect class="box" x="20" y="20" width="210" height="180" rx="12"/>
  <text class="hd" x="125" y="54" text-anchor="middle">pasta</text>
  <text class="sub" x="125" y="82" text-anchor="middle">do projeto</text>
  <rect class="chip ed" x="40" y="104" width="170" height="44" rx="8"/>
  <text class="code file" x="125" y="133" text-anchor="middle">notas.txt</text>
  <text class="cap" x="125" y="182" text-anchor="middle" fill="#fbbf24">editado</text>

  <!-- marcados para o commit -->
  <rect class="box" x="255" y="20" width="210" height="180" rx="12"/>
  <text class="hd" x="360" y="54" text-anchor="middle">marcados</text>
  <text class="sub" x="360" y="82" text-anchor="middle">para o commit</text>

  <!-- histórico -->
  <rect class="box" x="490" y="20" width="210" height="180" rx="12"/>
  <text class="hd" x="595" y="54" text-anchor="middle">histórico</text>
  <text class="sub" x="595" y="82" text-anchor="middle">de commits</text>

  <!-- 1: git add . -->
  <g class="s1">
    <path class="link" d="M 150 200 V 234 H 330 V 208"/>
    <text class="code cmd" x="240" y="270" text-anchor="middle">git add .</text>
  </g>
  <g class="c1">
    <rect class="chip mk" x="275" y="104" width="170" height="44" rx="8"/>
    <text class="code file" x="360" y="133" text-anchor="middle">notas.txt</text>
    <text class="cap" x="360" y="182" text-anchor="middle" fill="#34d399">marcado</text>
  </g>

  <!-- 2: git commit -m -->
  <g class="s2">
    <path class="link" d="M 400 200 V 234 H 580 V 208"/>
    <text class="code cmd" x="490" y="270" text-anchor="middle">git commit -m</text>
  </g>
  <g class="c2">
    <rect class="chip ph" x="500" y="104" width="190" height="44" rx="8"/>
    <g transform="translate(508 111) scale(1.25)" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <line x1="3" x2="9" y1="12" y2="12"/>
      <line x1="15" x2="21" y1="12" y2="12"/>
    </g>
    <text class="msg" x="544" y="133">Cria notas.txt</text>
    <text class="cap" x="595" y="182" text-anchor="middle" fill="#a78bfa">fotografia</text>
  </g>
</svg>
