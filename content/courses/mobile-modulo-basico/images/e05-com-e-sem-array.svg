<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" font-family="Inter, system-ui, sans-serif">
  <title>Com o array vazio, o efeito busca uma vez e a segunda renderização para ali; sem o array, setTarefas volta para a renderização e a busca se repete sem fim</title>
  <style>
    .box  { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .ok   { fill: #131c33; stroke: #34d399; stroke-width: 3; }
    .t    { fill: #e8edf7; font-size: 22px; }
    .m    { fill: #b4bfd3; font-size: 22px; }
    .code { font-family: 'JetBrains Mono', Consolas, monospace; }
    .seta { stroke: #a78bfa; stroke-width: 2.5; fill: none; marker-end: url(#ponta); }
  </style>
  <defs>
    <marker id="ponta" viewBox="0 0 10 10" markerWidth="5" markerHeight="5" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
    <marker id="ponta-erro" viewBox="0 0 10 10" markerWidth="5" markerHeight="5" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker>
  </defs>
  <rect width="720" height="370" rx="16" fill="#0b1020"/>

  <!-- com [] -->
  <rect x="20" y="20" width="330" height="330" rx="12" fill="none" stroke="#34d399" stroke-width="2"/>
  <text class="m" x="185" y="56" text-anchor="middle"><tspan class="code" fill="#e8edf7">}, [])</tspan> roda uma vez</text>
  <rect class="box" x="70" y="76" width="230" height="38" rx="8"/>
  <text class="t" x="185" y="103" text-anchor="middle">React desenha</text>
  <path class="seta" d="M 185 114 L 185 134"/>
  <rect class="box" x="70" y="138" width="230" height="38" rx="8"/>
  <text class="t" x="185" y="165" text-anchor="middle">efeito busca</text>
  <path class="seta" d="M 185 176 L 185 196"/>
  <rect class="box" x="70" y="200" width="230" height="38" rx="8"/>
  <text class="t code" x="185" y="227" text-anchor="middle">setTarefas</text>
  <path class="seta" d="M 185 238 L 185 258"/>
  <rect class="ok" x="70" y="262" width="230" height="38" rx="8"/>
  <text class="t" x="185" y="289" text-anchor="middle">desenha de novo</text>
  <text x="185" y="334" text-anchor="middle" font-size="22" font-weight="700" fill="#34d399">uma busca só</text>

  <!-- sem array -->
  <rect x="370" y="20" width="330" height="330" rx="12" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="8 6"/>
  <text class="m" x="535" y="56" text-anchor="middle"><tspan class="code" fill="#e8edf7">})</tspan> toda renderização</text>
  <rect class="box" x="400" y="76" width="230" height="38" rx="8"/>
  <text class="t" x="515" y="103" text-anchor="middle">React desenha</text>
  <path class="seta" d="M 515 114 L 515 134"/>
  <rect class="box" x="400" y="138" width="230" height="38" rx="8"/>
  <text class="t" x="515" y="165" text-anchor="middle">efeito busca</text>
  <path class="seta" d="M 515 176 L 515 196"/>
  <rect class="box" x="400" y="200" width="230" height="38" rx="8"/>
  <text class="t code" x="515" y="227" text-anchor="middle">setTarefas</text>
  <path d="M 630 219 H 668 V 95 H 636" stroke="#f87171" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#ponta-erro)"/>
  <text x="535" y="334" text-anchor="middle" font-size="22" font-weight="700" fill="#f87171">buscas sem fim</text>
</svg>
