<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" font-family="Inter, system-ui, sans-serif">
  <title>O FormularioTarefa avisa o App por onAdicionar, o App chama setTarefas e a lista nova desce pela prop tarefas até ListaTarefas</title>
  <style>
    .box  { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .b    { fill: #e8edf7; font-size: 22px; font-weight: 700; }
    .m    { fill: #b4bfd3; font-size: 22px; }
    .code { font-family: 'JetBrains Mono', Consolas, monospace; }
    .sobe { stroke: #fbbf24; stroke-width: 3; fill: none; marker-end: url(#ponta-sobe); }
    .desce { stroke: #34d399; stroke-width: 3; fill: none; marker-end: url(#ponta-desce); }
    .s1 { animation: p1 8s infinite; }
    .s2 { animation: p2 8s infinite; }
    .s3 { animation: p3 8s infinite; }
    @keyframes p1 { 0%, 8% { opacity: 0; } 16%, 92% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes p2 { 0%, 32% { opacity: 0; } 40%, 92% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes p3 { 0%, 54% { opacity: 0; transform: translateY(-6px); } 62%, 92% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .s1, .s2, .s3 { animation: none; } }
  </style>
  <defs>
    <marker id="ponta-sobe" viewBox="0 0 10 10" markerWidth="6" markerHeight="6" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker>
    <marker id="ponta-desce" viewBox="0 0 10 10" markerWidth="6" markerHeight="6" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
  </defs>
  <rect width="720" height="370" rx="16" fill="#0b1020"/>

  <!-- App: o dono do estado -->
  <rect class="box" x="230" y="24" width="260" height="90" rx="12"/>
  <text class="b" x="360" y="60" text-anchor="middle" font-size="24">App</text>
  <text class="m" x="360" y="96" text-anchor="middle">guarda <tspan class="code" fill="#e8edf7">tarefas</tspan></text>

  <!-- filhos -->
  <rect class="box" x="30" y="250" width="270" height="90" rx="12"/>
  <text class="b" x="165" y="286" text-anchor="middle">FormularioTarefa</text>
  <text class="m" x="165" y="320" text-anchor="middle">a pessoa envia</text>

  <rect class="box" x="420" y="250" width="270" height="90" rx="12"/>
  <text class="b" x="555" y="286" text-anchor="middle">ListaTarefas</text>

  <!-- 1: o evento sobe -->
  <g class="s1">
    <path class="sobe" d="M 182 244 L 260 122"/>
    <text class="code" x="206" y="174" text-anchor="end" font-size="22" font-weight="700" fill="#fbbf24">onAdicionar</text>
    <text class="m" x="196" y="206" text-anchor="end">1 evento sobe</text>
  </g>

  <!-- 2: o App troca o estado -->
  <g class="s2">
    <rect x="230" y="24" width="260" height="90" rx="12" fill="none" stroke="#34d399" stroke-width="3"/>
    <text class="code" x="506" y="76" font-size="22" font-weight="700" fill="#34d399"><tspan font-family="Inter, system-ui, sans-serif">2 </tspan>setTarefas</text>
  </g>

  <!-- 3: o dado desce -->
  <g class="s3">
    <path class="desce" d="M 460 122 L 538 244"/>
    <text class="code" x="526" y="174" font-size="22" font-weight="700" fill="#34d399">tarefas</text>
    <text class="m" x="540" y="206">3 dado desce</text>
    <text x="555" y="322" text-anchor="middle" font-size="22" font-weight="700" fill="#34d399">+ tarefa nova</text>
  </g>
</svg>
