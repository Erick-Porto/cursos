<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Inter, system-ui, sans-serif">
  <title>Com push, antes e depois apontam para o mesmo array e o React não redesenha; com um array novo, o React vê a diferença e redesenha</title>
  <style>
    .cell { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .t    { fill: #e8edf7; font-size: 22px; }
    .m    { fill: #b4bfd3; font-size: 22px; }
    .code { font-family: 'JetBrains Mono', Consolas, monospace; }
    .seta { stroke: #a78bfa; stroke-width: 2.5; fill: none; marker-end: url(#ponta); }
  </style>
  <defs>
    <marker id="ponta" viewBox="0 0 10 10" markerWidth="6" markerHeight="6" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
  </defs>
  <rect width="720" height="340" rx="16" fill="#0b1020"/>

  <!-- push: o mesmo array -->
  <rect x="20" y="20" width="330" height="300" rx="12" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="8 6"/>
  <text class="t code" x="185" y="64" text-anchor="middle">tarefas.push(nova)</text>
  <text class="m" x="44" y="136">antes</text>
  <text class="m" x="44" y="216">depois</text>
  <path class="seta" d="M 108 130 L 196 162"/>
  <path class="seta" d="M 116 208 L 196 184"/>
  <rect class="cell" x="206" y="150" width="64" height="48"/>
  <rect class="cell" x="270" y="150" width="64" height="48"/>
  <text class="t code" x="238" y="182" text-anchor="middle">id 1</text>
  <text class="t code" x="302" y="182" text-anchor="middle">id 2</text>
  <text x="185" y="264" text-anchor="middle" font-size="22" font-weight="700" fill="#f87171">mesmo array</text>
  <text class="m" x="185" y="296" text-anchor="middle">React não redesenha</text>

  <!-- array novo -->
  <rect x="370" y="20" width="330" height="300" rx="12" fill="none" stroke="#34d399" stroke-width="2"/>
  <text class="t code" x="535" y="64" text-anchor="middle">[...tarefas, nova]</text>
  <text class="m" x="394" y="136">antes</text>
  <text class="m" x="394" y="216">depois</text>
  <path class="seta" d="M 458 129 L 520 129"/>
  <path class="seta" d="M 466 209 L 520 209"/>
  <rect class="cell" x="530" y="106" width="64" height="48"/>
  <text class="t code" x="562" y="138" text-anchor="middle">id 1</text>
  <rect class="cell" x="530" y="186" width="64" height="48"/>
  <rect class="cell" x="594" y="186" width="64" height="48"/>
  <text class="t code" x="562" y="218" text-anchor="middle">id 1</text>
  <text class="t code" x="626" y="218" text-anchor="middle">id 2</text>
  <text x="535" y="264" text-anchor="middle" font-size="22" font-weight="700" fill="#34d399">array novo</text>
  <text class="m" x="535" y="296" text-anchor="middle">React redesenha</text>
</svg>
