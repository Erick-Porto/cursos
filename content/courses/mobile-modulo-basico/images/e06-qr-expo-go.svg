<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" font-family="Inter, system-ui, sans-serif">
  <title>O Expo Go lê o QR code do npx expo start, o app chega do computador pelo mesmo Wi-Fi e abre no celular</title>
  <style>
    .box  { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .t    { fill: #e8edf7; font-size: 22px; }
    .b    { fill: #e8edf7; font-size: 22px; font-weight: 700; }
    .m    { fill: #b4bfd3; font-size: 22px; }
    .code { font-family: 'JetBrains Mono', Consolas, monospace; }
    .lbl  { fill: #a78bfa; font-size: 22px; font-weight: 700; }
    .s1 { animation: p1 8s infinite; }
    .s2 { animation: p2 8s infinite; }
    .pacote { animation: viaja 8s infinite; }
    .s3 { animation: p3 8s infinite; }
    @keyframes p1 { 0%, 8% { opacity: 0; } 14%, 92% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes p2 { 0%, 26% { opacity: 0; } 32%, 92% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes viaja {
      0%, 24% { opacity: 0; transform: translateX(-170px); }
      28%     { opacity: 1; transform: translateX(-170px); }
      50%, 92% { opacity: 1; transform: translateX(0); }
      100%    { opacity: 0; transform: translateX(0); }
    }
    @keyframes p3 { 0%, 54% { opacity: 0; } 62%, 92% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .s1, .s2, .pacote, .s3 { animation: none; } }
  </style>
  <defs>
    <marker id="ponta" viewBox="0 0 10 10" markerWidth="6" markerHeight="6" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
    <marker id="ponta-rede" viewBox="0 0 10 10" markerWidth="6" markerHeight="6" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/></marker>
  </defs>
  <rect width="720" height="370" rx="16" fill="#0b1020"/>

  <!-- computador com o QR code -->
  <rect class="box" x="30" y="40" width="270" height="196" rx="10"/>
  <rect x="14" y="240" width="302" height="14" rx="6" fill="#2a3a5c"/>
  <text class="t code" x="165" y="80" text-anchor="middle">npx expo start</text>
  <g transform="translate(117 108) scale(4)" fill="none" stroke="#e8edf7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/>
  </g>
  <text class="m" x="165" y="290" text-anchor="middle">computador</text>

  <!-- celular com o Expo Go -->
  <rect x="530" y="24" width="150" height="276" rx="22" fill="#131c33" stroke="#b4bfd3" stroke-width="2"/>
  <text class="b" x="605" y="62" text-anchor="middle">Expo Go</text>
  <rect x="544" y="80" width="122" height="196" rx="8" fill="#0b1020" stroke="#2a3a5c" stroke-width="1.5"/>
  <rect x="585" y="286" width="40" height="5" rx="2.5" fill="#2a3a5c"/>

  <!-- rede Wi-Fi -->
  <path d="M 304 212 L 522 212" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="8 6" fill="none" marker-end="url(#ponta-rede)"/>
  <g transform="translate(391 164) scale(2)" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/>
  </g>

  <!-- 1: o Expo Go lê o QR code -->
  <g class="s1">
    <path d="M 526 140 L 212 140" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="4 6" fill="none" marker-end="url(#ponta)"/>
    <text class="lbl" x="415" y="124" text-anchor="middle">1 lê o QR code</text>
  </g>

  <!-- 2: o app viaja pelo Wi-Fi -->
  <circle class="pacote" cx="490" cy="212" r="10" fill="#a78bfa"/>
  <g class="s2">
    <text class="lbl" x="415" y="252" text-anchor="middle">2 o app chega</text>
    <text class="m" x="415" y="282" text-anchor="middle">pelo mesmo Wi-Fi</text>
  </g>

  <!-- 3: o app abre -->
  <g class="s3">
    <rect x="544" y="80" width="122" height="196" rx="8" fill="#e8edf7"/>
    <rect x="562" y="160" width="86" height="10" rx="5" fill="#0b1020"/>
    <rect x="568" y="180" width="74" height="10" rx="5" fill="#0b1020"/>
    <rect x="578" y="200" width="54" height="10" rx="5" fill="#0b1020"/>
    <text class="lbl" x="605" y="340" text-anchor="middle">3 o app abre</text>
  </g>
</svg>
