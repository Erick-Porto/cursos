<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Inter, system-ui, sans-serif">
  <title>As quatro propriedades ACID: atomicidade, consistência, isolamento e durabilidade, cada uma com a sua garantia</title>
  <style>
    .t { fill: #e8edf7; font-size: 24px; font-weight: 700; }
    .m { fill: #b4bfd3; font-size: 22px; }
    .big { font-size: 36px; font-weight: 700; }
    .box { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
  </style>
  <rect width="720" height="340" rx="16" fill="#0b1020"/>

  <g>
    <rect x="30" y="20" width="320" height="140" rx="12" class="box"/>
    <text x="56" y="72" class="big" fill="#34d399">A</text>
    <text x="102" y="72" class="t">Atomicidade</text>
    <text x="56" y="110" class="m">tudo ou nada: falhou um,</text>
    <text x="56" y="142" class="m">desfaz todos</text>
  </g>

  <g>
    <rect x="370" y="20" width="320" height="140" rx="12" class="box"/>
    <text x="396" y="72" class="big" fill="#60a5fa">C</text>
    <text x="442" y="72" class="t">Consistência</text>
    <text x="396" y="110" class="m">as regras continuam</text>
    <text x="396" y="142" class="m">válidas após o COMMIT</text>
  </g>

  <g>
    <rect x="30" y="180" width="320" height="140" rx="12" class="box"/>
    <text x="56" y="232" class="big" fill="#a78bfa">I</text>
    <text x="102" y="232" class="t">Isolamento</text>
    <text x="56" y="270" class="m">cada transação vê</text>
    <text x="56" y="302" class="m">um estado coerente</text>
  </g>

  <g>
    <rect x="370" y="180" width="320" height="140" rx="12" class="box"/>
    <text x="396" y="232" class="big" fill="#fbbf24">D</text>
    <text x="442" y="232" class="t">Durabilidade</text>
    <text x="396" y="270" class="m">após o COMMIT, resiste</text>
    <text x="396" y="302" class="m">à queda de energia</text>
  </g>
</svg>
