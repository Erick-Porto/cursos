<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Inter, system-ui, sans-serif">
  <title>Chave estrangeira ao apagar um cliente com pedidos: com RESTRICT o DELETE é bloqueado; com ON DELETE CASCADE os pedidos são apagados junto</title>
  <style>
    .code { fill: #e8edf7; font-family: 'JetBrains Mono', Consolas, monospace; font-size: 22px; font-weight: 700; }
    .t { fill: #e8edf7; font-size: 22px; font-weight: 700; }
    .c { fill: #e8edf7; font-size: 22px; }
    .s { fill: #e8edf7; font-size: 20px; }
    .m { fill: #b4bfd3; font-size: 18px; }
    .box { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .no { fill: #131c33; stroke: #f87171; stroke-width: 2.5; stroke-dasharray: 8 5; }
    .cascade { fill: #131c33; stroke: #fbbf24; stroke-width: 2.5; }
    .arrow { stroke: #60a5fa; stroke-width: 2.5; fill: none; marker-end: url(#head); }
  </style>
  <defs><marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/></marker></defs>
  <rect width="720" height="320" rx="16" fill="#0b1020"/>
  <text x="360" y="40" text-anchor="middle" class="code">DELETE FROM clientes WHERE id = 1;</text>

  <rect x="40" y="66" width="240" height="104" rx="12" class="box"/>
  <text x="160" y="96" text-anchor="middle" class="t">clientes</text>
  <text x="160" y="130" text-anchor="middle" class="c">1 · Ana Souza</text>
  <text x="160" y="158" text-anchor="middle" class="m">linha pai</text>

  <rect x="440" y="66" width="240" height="104" rx="12" class="box"/>
  <text x="560" y="96" text-anchor="middle" class="t">pedidos</text>
  <text x="560" y="130" text-anchor="middle" class="c">1 · cliente_id = 1</text>
  <text x="560" y="158" text-anchor="middle" class="c">3 · cliente_id = 1</text>

  <path d="M440 126 L290 126" class="arrow"/>
  <text x="360" y="114" text-anchor="middle" class="m">FOREIGN KEY (cliente_id)</text>

  <rect x="40" y="200" width="300" height="90" rx="12" class="no"/>
  <text x="190" y="234" text-anchor="middle" class="t" fill="#f87171">RESTRICT (padrão)</text>
  <text x="190" y="268" text-anchor="middle" class="s">ERROR 1451: nada é apagado</text>

  <rect x="380" y="200" width="300" height="90" rx="12" class="cascade"/>
  <text x="530" y="234" text-anchor="middle" class="t" fill="#fbbf24">ON DELETE CASCADE</text>
  <text x="530" y="268" text-anchor="middle" class="s">apaga Ana e seus 2 pedidos</text>
</svg>
