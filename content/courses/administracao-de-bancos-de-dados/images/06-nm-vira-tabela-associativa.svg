<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Inter, system-ui, sans-serif">
  <title>Animação em três passos: o relacionamento N:M entre pedido e produto, com o atributo quantidade, vira a tabela associativa itens_pedido, cujas chaves estrangeiras pedido_id e produto_id formam a chave primária</title>
  <style>
    .t { fill: #e8edf7; font-size: 22px; font-weight: 700; }
    .hd { fill: #06281c; font-size: 22px; font-weight: 700; }
    .m { fill: #b4bfd3; font-size: 18px; }
    .c { fill: #e8edf7; font-size: 22px; }
    .v { fill: #e8edf7; font-size: 18px; font-weight: 700; }
    .p { fill: #a78bfa; font-size: 18px; font-weight: 700; }
    .k { fill: #34d399; font-size: 18px; font-weight: 700; }
    .n { fill: #fbbf24; font-size: 18px; font-weight: 700; }
    .box { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .head { fill: #34d399; }
    .ln { stroke: #a78bfa; stroke-width: 2.5; fill: none; }
    .arrow { stroke: #a78bfa; stroke-width: 3; fill: none; marker-end: url(#head); }
    .step { opacity: .3; animation: entra1 8s infinite; }
    .s2 { animation-name: entra2; }
    .s3 { animation-name: entra3; }
    @keyframes entra1 { 0% { opacity: .3 } 5%, 92% { opacity: 1 } 100% { opacity: .3 } }
    @keyframes entra2 { 0%, 30% { opacity: .3 } 36%, 92% { opacity: 1 } 100% { opacity: .3 } }
    @keyframes entra3 { 0%, 58% { opacity: .3 } 64%, 92% { opacity: 1 } 100% { opacity: .3 } }
    @media (prefers-reduced-motion: reduce) { .step { animation: none !important; opacity: 1 !important; } }
  </style>
  <defs><marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect width="720" height="380" rx="16" fill="#0b1020"/>

  <!-- passo 1: o relacionamento N:M no DER -->
  <g class="step s1">
    <text x="24" y="28" class="m">1. No DER: relacionamento N:M</text>
    <rect x="90" y="40" width="160" height="56" rx="12" class="box"/>
    <text x="170" y="76" text-anchor="middle" class="t">pedido</text>
    <rect x="470" y="40" width="160" height="56" rx="12" class="box"/>
    <text x="550" y="76" text-anchor="middle" class="t">produto</text>
    <path d="M250 68 L470 68 M268 68 L250 59 M268 68 L250 77 M452 68 L470 59 M452 68 L470 77" class="ln"/>
    <text x="360" y="58" text-anchor="middle" class="v">contém</text>
    <text x="280" y="92" text-anchor="middle" class="n">N</text>
    <text x="440" y="92" text-anchor="middle" class="n">M</text>
    <text x="360" y="92" text-anchor="middle" class="n">quantidade</text>
  </g>

  <!-- tabelas das entidades (sempre visíveis) -->
  <rect x="20" y="176" width="180" height="108" rx="12" class="box"/>
  <path d="M20 188 a12 12 0 0 1 12 -12 h156 a12 12 0 0 1 12 12 v28 h-180 z" class="head"/>
  <text x="110" y="204" text-anchor="middle" class="hd">pedidos</text>
  <text x="34" y="244" class="c">id</text><text x="186" y="244" text-anchor="end" class="k">PK</text>
  <text x="34" y="272" class="c">cliente_id</text><text x="186" y="272" text-anchor="end" class="k">FK</text>

  <rect x="520" y="176" width="180" height="108" rx="12" class="box"/>
  <path d="M520 188 a12 12 0 0 1 12 -12 h156 a12 12 0 0 1 12 12 v28 h-180 z" class="head"/>
  <text x="610" y="204" text-anchor="middle" class="hd">produtos</text>
  <text x="534" y="244" class="c">id</text><text x="686" y="244" text-anchor="end" class="k">PK</text>
  <text x="534" y="272" class="c">nome</text>

  <!-- passo 2: nasce a tabela associativa -->
  <g class="step s2">
    <text x="24" y="140" class="m">2. No modelo lógico</text>
    <path d="M360 104 L360 164" class="arrow"/>
    <text x="376" y="140" class="p">vira tabela</text>
    <rect x="250" y="176" width="220" height="136" rx="12" class="box"/>
    <path d="M250 188 a12 12 0 0 1 12 -12 h196 a12 12 0 0 1 12 12 v28 h-220 z" class="head"/>
    <text x="360" y="204" text-anchor="middle" class="hd">itens_pedido</text>
    <text x="264" y="244" class="c">pedido_id</text><text x="456" y="244" text-anchor="end" class="k">PK FK</text>
    <text x="264" y="272" class="c">produto_id</text><text x="456" y="272" text-anchor="end" class="k">PK FK</text>
    <text x="264" y="300" class="c">quantidade</text>
  </g>

  <!-- passo 3: as chaves estrangeiras ligam as três tabelas -->
  <g class="step s3">
    <path d="M200 258 L250 258 M210 249 L210 267 M234 258 L250 249 M234 258 L250 267" class="ln"/>
    <text x="214" y="250" text-anchor="middle" class="n">1</text>
    <text x="238" y="250" text-anchor="middle" class="n">N</text>
    <path d="M470 258 L520 258 M486 258 L470 249 M486 258 L470 267 M510 249 L510 267" class="ln"/>
    <text x="482" y="250" text-anchor="middle" class="n">N</text>
    <text x="506" y="250" text-anchor="middle" class="n">1</text>
    <text x="24" y="352" class="m">3. as duas FKs, juntas, formam a chave primária</text>
  </g>
</svg>
