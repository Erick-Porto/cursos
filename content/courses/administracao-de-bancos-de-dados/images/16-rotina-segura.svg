<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Inter, system-ui, sans-serif">
  <title>Rotina segura para UPDATE e DELETE: SELECT para conferir o filtro, START TRANSACTION, o comando, SELECT de conferência e então COMMIT ou ROLLBACK</title>
  <style>
    .t { fill: #e8edf7; font-size: 22px; font-weight: 700; }
    .m { fill: #b4bfd3; font-size: 18px; }
    .box { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .ok { fill: #131c33; stroke: #34d399; stroke-width: 2.5; }
    .undo { fill: #131c33; stroke: #fbbf24; stroke-width: 2.5; }
    .arrow { stroke: #a78bfa; stroke-width: 2.5; fill: none; marker-end: url(#head); }
    .line { stroke: #a78bfa; stroke-width: 2.5; fill: none; }
  </style>
  <defs><marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect width="720" height="300" rx="16" fill="#0b1020"/>

  <rect x="20" y="40" width="160" height="104" rx="12" class="box"/>
  <text x="100" y="74" text-anchor="middle" class="t">1. SELECT</text>
  <text x="100" y="102" text-anchor="middle" class="m">mesmo WHERE:</text>
  <text x="100" y="126" text-anchor="middle" class="m">conte as linhas</text>

  <rect x="193" y="40" width="160" height="104" rx="12" class="box"/>
  <text x="273" y="74" text-anchor="middle" class="t">2. START</text>
  <text x="273" y="100" text-anchor="middle" class="t">TRANSACTION</text>
  <text x="273" y="126" text-anchor="middle" class="m">área provisória</text>

  <rect x="366" y="40" width="160" height="104" rx="12" class="box"/>
  <text x="446" y="74" text-anchor="middle" class="t">3. UPDATE</text>
  <text x="446" y="100" text-anchor="middle" class="t">ou DELETE</text>
  <text x="446" y="126" text-anchor="middle" class="m">Rows matched?</text>

  <rect x="539" y="40" width="160" height="104" rx="12" class="box"/>
  <text x="619" y="74" text-anchor="middle" class="t">4. SELECT</text>
  <text x="619" y="102" text-anchor="middle" class="m">confira o</text>
  <text x="619" y="126" text-anchor="middle" class="m">resultado</text>

  <path d="M180 92 L189 92" class="arrow"/>
  <path d="M353 92 L362 92" class="arrow"/>
  <path d="M526 92 L535 92" class="arrow"/>

  <path d="M619 144 L619 168 L305 168" class="line"/>
  <path d="M305 168 L305 192" class="arrow"/>
  <path d="M575 168 L575 192" class="arrow"/>

  <rect x="190" y="196" width="230" height="80" rx="12" class="ok"/>
  <text x="305" y="228" text-anchor="middle" class="t">5a. COMMIT</text>
  <text x="305" y="258" text-anchor="middle" class="m">deu certo: grava</text>

  <rect x="460" y="196" width="230" height="80" rx="12" class="undo"/>
  <text x="575" y="228" text-anchor="middle" class="t">5b. ROLLBACK</text>
  <text x="575" y="258" text-anchor="middle" class="m">errou: desfaz tudo</text>
</svg>
