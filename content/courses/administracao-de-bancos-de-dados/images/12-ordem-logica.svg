<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Inter, system-ui, sans-serif">
  <title>Ordem lógica de execução de um SELECT: FROM, WHERE, GROUP BY, HAVING, SELECT e, por último, ORDER BY</title>
  <style>
    .t { fill: #e8edf7; font-size: 22px; font-weight: 700; }
    .m { fill: #b4bfd3; font-size: 18px; }
    .n { fill: #34d399; font-size: 22px; font-weight: 700; }
    .box { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .arrow { stroke: #a78bfa; stroke-width: 2.5; fill: none; marker-end: url(#head); }
  </style>
  <defs><marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect width="720" height="330" rx="16" fill="#0b1020"/>

  <text x="360" y="42" text-anchor="middle" class="m">Você escreve SELECT primeiro, mas o MySQL executa nesta ordem:</text>

  <rect x="30" y="66" width="200" height="90" rx="12" class="box"/>
  <text x="130" y="104" text-anchor="middle" class="t"><tspan class="n">1</tspan>  FROM</text>
  <text x="130" y="138" text-anchor="middle" class="m">escolhe as tabelas</text>

  <rect x="260" y="66" width="200" height="90" rx="12" class="box"/>
  <text x="360" y="104" text-anchor="middle" class="t"><tspan class="n">2</tspan>  WHERE</text>
  <text x="360" y="138" text-anchor="middle" class="m">filtra linhas</text>

  <rect x="490" y="66" width="200" height="90" rx="12" class="box"/>
  <text x="590" y="104" text-anchor="middle" class="t"><tspan class="n">3</tspan>  GROUP BY</text>
  <text x="590" y="138" text-anchor="middle" class="m">forma grupos</text>

  <rect x="30" y="200" width="200" height="90" rx="12" class="box"/>
  <text x="130" y="238" text-anchor="middle" class="t"><tspan class="n">4</tspan>  HAVING</text>
  <text x="130" y="272" text-anchor="middle" class="m">filtra grupos</text>

  <rect x="260" y="200" width="200" height="90" rx="12" class="box"/>
  <text x="360" y="238" text-anchor="middle" class="t"><tspan class="n">5</tspan>  SELECT</text>
  <text x="360" y="272" text-anchor="middle" class="m">calcula as colunas</text>

  <rect x="490" y="200" width="200" height="90" rx="12" class="box"/>
  <text x="590" y="238" text-anchor="middle" class="t"><tspan class="n">6</tspan>  ORDER BY</text>
  <text x="590" y="272" text-anchor="middle" class="m">ordena o resultado</text>

  <path d="M230 111 L256 111" class="arrow"/>
  <path d="M460 111 L486 111" class="arrow"/>
  <path d="M590 156 L590 178 L130 178 L130 196" class="arrow"/>
  <path d="M230 245 L256 245" class="arrow"/>
  <path d="M460 245 L486 245" class="arrow"/>
</svg>
