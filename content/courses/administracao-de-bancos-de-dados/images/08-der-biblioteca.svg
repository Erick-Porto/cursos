<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Inter, system-ui, sans-serif">
  <title>DER final da biblioteca: autor escreve livro (N:M); editora publica livro (1:N); livro tem exemplares (1:N); exemplar sai em empréstimo (1:N); usuário faz empréstimos (1:N)</title>
  <style>
    .t { fill: #e8edf7; font-size: 22px; font-weight: 700; }
    .r { fill: #a78bfa; font-size: 18px; font-weight: 700; }
    .card { fill: #fbbf24; font-size: 18px; font-weight: 700; }
    .box { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .line { stroke: #a78bfa; stroke-width: 2.5; fill: none; }
  </style>
  <rect width="720" height="340" rx="16" fill="#0b1020"/>

  <rect x="20" y="40" width="170" height="64" rx="12" class="box"/>
  <text x="105" y="80" text-anchor="middle" class="t">Autor</text>

  <rect x="275" y="40" width="170" height="64" rx="12" class="box"/>
  <text x="360" y="80" text-anchor="middle" class="t">Livro</text>

  <rect x="530" y="40" width="170" height="64" rx="12" class="box"/>
  <text x="615" y="80" text-anchor="middle" class="t">Editora</text>

  <rect x="20" y="220" width="170" height="64" rx="12" class="box"/>
  <text x="105" y="260" text-anchor="middle" class="t">Usuário</text>

  <rect x="275" y="220" width="170" height="64" rx="12" class="box"/>
  <text x="360" y="260" text-anchor="middle" class="t">Exemplar</text>

  <rect x="530" y="220" width="170" height="64" rx="12" class="box"/>
  <text x="615" y="260" text-anchor="middle" class="t">Empréstimo</text>

  <!-- autor N:M livro -->
  <path d="M190 72 L275 72" class="line"/>
  <text x="232" y="62" text-anchor="middle" class="r">escreve</text>
  <text x="200" y="96" class="card">N</text>
  <text x="265" y="96" text-anchor="end" class="card">M</text>

  <!-- editora 1:N livro -->
  <path d="M445 72 L530 72" class="line"/>
  <text x="487" y="62" text-anchor="middle" class="r">publica</text>
  <text x="455" y="96" class="card">N</text>
  <text x="520" y="96" text-anchor="end" class="card">1</text>

  <!-- livro 1:N exemplar -->
  <path d="M360 104 L360 220" class="line"/>
  <text x="372" y="168" class="r">tem</text>
  <text x="348" y="126" text-anchor="end" class="card">1</text>
  <text x="348" y="212" text-anchor="end" class="card">N</text>

  <!-- exemplar 1:N emprestimo -->
  <path d="M445 252 L530 252" class="line"/>
  <text x="487" y="242" text-anchor="middle" class="r">sai em</text>
  <text x="455" y="276" class="card">1</text>
  <text x="520" y="276" text-anchor="end" class="card">N</text>

  <!-- usuario 1:N emprestimo -->
  <path d="M105 284 L105 316 L615 316 L615 284" class="line"/>
  <text x="360" y="308" text-anchor="middle" class="r">faz</text>
  <text x="115" y="304" class="card">1</text>
  <text x="605" y="304" text-anchor="end" class="card">N</text>
</svg>
