<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" font-family="Inter, system-ui, sans-serif">
  <title>Duas tabelas relacionadas: a coluna categoria_id de produtos, chave estrangeira, aponta para a chave primária id de categorias</title>
  <style>
    .lbl { fill: #a78bfa; font-size: 22px; font-weight: 700; }
    .a { fill: #fbbf24; font-size: 18px; font-weight: 700; }
    .m { fill: #b4bfd3; font-size: 18px; }
    .th { fill: #e8edf7; font-size: 22px; font-weight: 700; }
    .k { fill: #06281c; font-size: 22px; font-weight: 700; }
    .kf { fill: #0b1020; font-size: 22px; font-weight: 700; }
    .td { fill: #e8edf7; font-size: 22px; }
    .head { fill: #2a3a5c; }
    .pk { fill: #34d399; }
    .fk { fill: #fbbf24; }
    .cell { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .arrow { stroke: #fbbf24; stroke-width: 3; fill: none; marker-end: url(#head); }
  </style>
  <defs>
    <marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker>
  </defs>
  <rect width="720" height="310" rx="16" fill="#0b1020"/>

  <path d="M611 82 L611 46 L58 46 L58 76" class="arrow"/>
  <text x="334" y="38" text-anchor="middle" class="a">categoria_id aponta para id</text>

  <text x="143" y="74" text-anchor="middle" class="lbl">categorias</text>
  <rect x="30" y="84" width="56" height="40" class="pk"/>
  <text x="58" y="112" text-anchor="middle" class="k">id</text>
  <rect x="86" y="84" width="170" height="40" class="head"/>
  <text x="171" y="112" text-anchor="middle" class="th">nome</text>
  <rect x="30" y="124" width="56" height="38" class="cell"/>
  <text x="58" y="150" text-anchor="middle" class="td">1</text>
  <rect x="86" y="124" width="170" height="38" class="cell"/>
  <text x="171" y="150" text-anchor="middle" class="td">Periféricos</text>
  <rect x="30" y="162" width="56" height="38" class="cell"/>
  <text x="58" y="188" text-anchor="middle" class="td">2</text>
  <rect x="86" y="162" width="170" height="38" class="cell"/>
  <text x="171" y="188" text-anchor="middle" class="td">Monitores</text>

  <text x="498" y="74" text-anchor="middle" class="lbl">produtos</text>
  <rect x="300" y="84" width="56" height="40" class="pk"/>
  <text x="328" y="112" text-anchor="middle" class="k">id</text>
  <rect x="356" y="84" width="170" height="40" class="head"/>
  <text x="441" y="112" text-anchor="middle" class="th">nome</text>
  <rect x="526" y="84" width="170" height="40" class="fk"/>
  <text x="611" y="112" text-anchor="middle" class="kf">categoria_id</text>

  <rect x="300" y="124" width="56" height="38" class="cell"/>
  <text x="328" y="150" text-anchor="middle" class="td">1</text>
  <rect x="356" y="124" width="170" height="38" class="cell"/>
  <text x="441" y="150" text-anchor="middle" class="td">Teclado</text>
  <rect x="526" y="124" width="170" height="38" class="cell"/>
  <text x="611" y="150" text-anchor="middle" class="td">1</text>

  <rect x="300" y="162" width="56" height="38" class="cell"/>
  <text x="328" y="188" text-anchor="middle" class="td">2</text>
  <rect x="356" y="162" width="170" height="38" class="cell"/>
  <text x="441" y="188" text-anchor="middle" class="td">Mouse</text>
  <rect x="526" y="162" width="170" height="38" class="cell"/>
  <text x="611" y="188" text-anchor="middle" class="td">1</text>

  <rect x="300" y="200" width="56" height="38" class="cell"/>
  <text x="328" y="226" text-anchor="middle" class="td">3</text>
  <rect x="356" y="200" width="170" height="38" class="cell"/>
  <text x="441" y="226" text-anchor="middle" class="td">Monitor</text>
  <rect x="526" y="200" width="170" height="38" class="cell"/>
  <text x="611" y="226" text-anchor="middle" class="td">2</text>

  <rect x="30" y="270" width="18" height="18" rx="4" class="pk"/>
  <text x="58" y="285" class="m">PK: chave primária</text>
  <rect x="300" y="270" width="18" height="18" rx="4" class="fk"/>
  <text x="328" y="285" class="m">FK: chave estrangeira</text>
</svg>
