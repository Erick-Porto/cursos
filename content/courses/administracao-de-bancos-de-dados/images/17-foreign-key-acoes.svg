<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Inter, system-ui, sans-serif">
  <title>O que acontece com o produto 4 quando a categoria 3 é apagada, conforme a ação ON DELETE: RESTRICT recusa o DELETE, CASCADE apaga o produto junto, SET NULL deixa o produto sem categoria</title>
  <style>
    .t { fill: #e8edf7; font-size: 22px; }
    .b { fill: #e8edf7; font-size: 22px; font-weight: 700; }
    .m { fill: #b4bfd3; font-size: 22px; }
    .code { fill: #e8edf7; font-family: 'JetBrains Mono', Consolas, monospace; font-size: 22px; }
    .box { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .arrow { stroke: #a78bfa; stroke-width: 2.5; fill: none; marker-end: url(#head); }
  </style>
  <defs><marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect width="720" height="340" rx="16" fill="#0b1020"/>

  <text x="360" y="34" text-anchor="middle" class="code">DELETE FROM categorias WHERE id = 3;</text>

  <rect x="200" y="52" width="320" height="44" rx="10" class="box"/>
  <text x="360" y="82" text-anchor="middle" class="t">categorias · 3 · Móveis</text>

  <path d="M360 96 L130 126" class="arrow"/>
  <path d="M360 96 L360 126" class="arrow"/>
  <path d="M360 96 L590 126" class="arrow"/>

  <rect x="20" y="130" width="220" height="40" rx="10" class="box" stroke="#fbbf24"/>
  <text x="130" y="157" text-anchor="middle" class="b" fill="#fbbf24">RESTRICT · padrão</text>
  <rect x="250" y="130" width="220" height="40" rx="10" class="box" stroke="#f87171"/>
  <text x="360" y="157" text-anchor="middle" class="b" fill="#f87171">CASCADE</text>
  <rect x="480" y="130" width="220" height="40" rx="10" class="box" stroke="#60a5fa"/>
  <text x="590" y="157" text-anchor="middle" class="b" fill="#60a5fa">SET NULL</text>

  <path d="M130 170 L130 186" class="arrow"/>
  <path d="M360 170 L360 186" class="arrow"/>
  <path d="M590 170 L590 186" class="arrow"/>

  <rect x="20" y="192" width="220" height="40" rx="10" class="box"/>
  <text x="130" y="219" text-anchor="middle" class="t">produto 4 · cat 3</text>
  <rect x="250" y="192" width="220" height="40" rx="10" class="box"/>
  <text x="360" y="219" text-anchor="middle" class="t">produto 4 · cat 3</text>
  <line x1="268" y1="212" x2="452" y2="212" stroke="#f87171" stroke-width="3"/>
  <rect x="480" y="192" width="220" height="40" rx="10" class="box"/>
  <text x="590" y="219" text-anchor="middle" class="t">produto 4 · NULL</text>

  <text x="130" y="274" text-anchor="middle" class="b" fill="#fbbf24">DELETE recusado</text>
  <text x="130" y="306" text-anchor="middle" class="m">ERROR 1451</text>
  <text x="360" y="274" text-anchor="middle" class="b" fill="#f87171">ambos apagados</text>
  <text x="360" y="306" text-anchor="middle" class="m">produto 4 some</text>
  <text x="590" y="274" text-anchor="middle" class="b" fill="#60a5fa">produto fica</text>
  <text x="590" y="306" text-anchor="middle" class="m">categoria_id = NULL</text>
</svg>
