<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" font-family="Inter, system-ui, sans-serif">
  <title>Três vitrines que se apontam entre si: o currículo leva ao LinkedIn e ao GitHub, e o LinkedIn leva ao GitHub</title>
  <style>
    .h { fill: #e8edf7; font-size: 24px; font-weight: 700; }
    .t { fill: #e8edf7; font-size: 22px; font-weight: 700; }
    .m { fill: #b4bfd3; font-size: 18px; }
    .box { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .hub { fill: #131c33; stroke: #34d399; stroke-width: 1.5; }
    .arrow { stroke: #a78bfa; stroke-width: 2.5; fill: none; marker-end: url(#head); }
  </style>
  <defs><marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect width="720" height="310" rx="16" fill="#0b1020"/>
  <text x="360" y="40" text-anchor="middle" class="h">Três vitrines que se apontam entre si</text>

  <rect x="30" y="64" width="240" height="90" rx="12" class="box"/>
  <text x="150" y="102" text-anchor="middle" class="t">LinkedIn</text>
  <text x="150" y="132" text-anchor="middle" class="m">perfil e competências</text>

  <rect x="450" y="64" width="240" height="90" rx="12" class="hub"/>
  <text x="570" y="102" text-anchor="middle" class="t">GitHub</text>
  <text x="570" y="132" text-anchor="middle" class="m">projeto final e README</text>

  <rect x="240" y="200" width="240" height="90" rx="12" class="box"/>
  <text x="360" y="238" text-anchor="middle" class="t">Currículo (PDF)</text>
  <text x="360" y="268" text-anchor="middle" class="m">uma página, por vaga</text>

  <path d="M272 112 L440 112" class="arrow"/>
  <text x="360" y="100" text-anchor="middle" class="m">link do repositório</text>

  <path d="M300 198 L190 162" class="arrow"/>
  <text x="206" y="192" text-anchor="middle" class="m">link</text>

  <path d="M420 198 L530 162" class="arrow"/>
  <text x="514" y="192" text-anchor="middle" class="m">link</text>
</svg>
