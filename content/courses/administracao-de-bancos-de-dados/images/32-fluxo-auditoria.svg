<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Inter, system-ui, sans-serif">
  <title>Fluxo da auditoria com triggers: a operação na tabela dispara o trigger, que grava OLD e NEW na tabela de auditoria, consultada pelos relatórios</title>
  <style>
    .h { fill: #e8edf7; font-size: 24px; font-weight: 700; }
    .t { fill: #e8edf7; font-size: 22px; font-weight: 700; }
    .m { fill: #b4bfd3; font-size: 18px; }
    .box { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .arrow { stroke: #a78bfa; stroke-width: 2.5; fill: none; marker-end: url(#head); }
  </style>
  <defs><marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect width="720" height="320" rx="16" fill="#0b1020"/>
  <text x="360" y="40" text-anchor="middle" class="h">Operação, trigger, trilha e relatório</text>

  <rect x="40" y="64" width="290" height="90" rx="12" class="box"/>
  <text x="185" y="102" text-anchor="middle" class="t">1. UPDATE clientes</text>
  <text x="185" y="132" text-anchor="middle" class="m">a linha é alterada</text>

  <rect x="390" y="64" width="290" height="90" rx="12" class="box" stroke="#a78bfa"/>
  <text x="535" y="102" text-anchor="middle" class="t">2. Trigger AFTER</text>
  <text x="535" y="132" text-anchor="middle" class="m">lê OLD, NEW e USER()</text>

  <rect x="390" y="206" width="290" height="90" rx="12" class="box" stroke="#34d399"/>
  <text x="535" y="244" text-anchor="middle" class="t">3. auditoria_clientes</text>
  <text x="535" y="274" text-anchor="middle" class="m">INSERT: antes e depois</text>

  <rect x="40" y="206" width="290" height="90" rx="12" class="box"/>
  <text x="185" y="244" text-anchor="middle" class="t">4. Relatório</text>
  <text x="185" y="274" text-anchor="middle" class="m">SELECT na trilha</text>

  <path d="M332 109 L382 109" class="arrow"/>
  <path d="M535 156 L535 198" class="arrow"/>
  <path d="M388 251 L338 251" class="arrow"/>
</svg>
