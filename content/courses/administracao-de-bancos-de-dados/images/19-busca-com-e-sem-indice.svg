<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Inter, system-ui, sans-serif">
  <title>Busca pelo e-mail gabi@exemplo.com: sem índice, o MySQL lê as oito linhas uma a uma; com índice B-tree, desce da raiz à folha e vai direto à linha</title>
  <style>
    .t { fill: #e8edf7; font-size: 22px; font-weight: 700; }
    .n { fill: #e8edf7; font-size: 22px; }
    .m { fill: #b4bfd3; font-size: 22px; }
    .code { fill: #e8edf7; font-family: 'JetBrains Mono', Consolas, monospace; font-size: 22px; }
    .box { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .ln { stroke: #2a3a5c; stroke-width: 2.5; fill: none; }
    .row { opacity: .35; animation: scan 8s infinite; }
    .r2 { animation-delay: .4s; } .r3 { animation-delay: .8s; } .r4 { animation-delay: 1.2s; }
    .r5 { animation-delay: 1.6s; } .r6 { animation-delay: 2s; } .r7 { animation-delay: 2.4s; } .r8 { animation-delay: 2.8s; }
    .found { opacity: 0; animation: found 8s infinite; }
    .dim { opacity: .5; }
    .i1 { opacity: .35; animation: idx1 8s infinite; }
    .i2 { opacity: .35; animation: idx2 8s infinite; }
    .i3 { opacity: .35; animation: idx3 8s infinite; }
    @keyframes scan { 0% { opacity: .35 } 3%, 9% { opacity: 1 } 13%, 100% { opacity: .35 } }
    @keyframes found { 0%, 32% { opacity: 0 } 35%, 80% { opacity: 1 } 84%, 100% { opacity: 0 } }
    @keyframes idx1 { 0% { opacity: .35 } 5%, 80% { opacity: 1 } 85%, 100% { opacity: .35 } }
    @keyframes idx2 { 0%, 13% { opacity: .35 } 17%, 80% { opacity: 1 } 85%, 100% { opacity: .35 } }
    @keyframes idx3 { 0%, 24% { opacity: .35 } 28%, 80% { opacity: 1 } 85%, 100% { opacity: .35 } }
    @media (prefers-reduced-motion: reduce) {
      .row, .found, .i1, .i2, .i3 { animation: none !important; opacity: 1 !important; }
    }
  </style>
  <rect width="720" height="420" rx="16" fill="#0b1020"/>
  <text x="360" y="30" text-anchor="middle" class="code">WHERE email = 'gabi@exemplo.com'</text>

  <text x="190" y="64" text-anchor="middle" class="t">Sem índice: lê tudo</text>
  <g class="row r1"><rect x="20" y="80" width="340" height="30" rx="6" class="box"/><text x="32" y="102" class="code">1 ana@exemplo.com</text></g>
  <g class="row r2"><rect x="20" y="116" width="340" height="30" rx="6" class="box"/><text x="32" y="138" class="code">2 bruno@exemplo.com</text></g>
  <g class="row r3"><rect x="20" y="152" width="340" height="30" rx="6" class="box"/><text x="32" y="174" class="code">3 carla@exemplo.com</text></g>
  <g class="row r4"><rect x="20" y="188" width="340" height="30" rx="6" class="box"/><text x="32" y="210" class="code">4 diego@exemplo.com</text></g>
  <g class="row r5"><rect x="20" y="224" width="340" height="30" rx="6" class="box"/><text x="32" y="246" class="code">5 elisa@exemplo.com</text></g>
  <g class="row r6"><rect x="20" y="260" width="340" height="30" rx="6" class="box"/><text x="32" y="282" class="code">6 fabio@exemplo.com</text></g>
  <g class="row r7"><rect x="20" y="296" width="340" height="30" rx="6" class="box"/><text x="32" y="318" class="code">7 gabi@exemplo.com</text></g>
  <g class="row r8"><rect x="20" y="332" width="340" height="30" rx="6" class="box"/><text x="32" y="354" class="code">8 helena@exemplo.com</text></g>
  <g class="found">
    <rect x="20" y="296" width="340" height="30" rx="6" fill="#34d399" fill-opacity=".18" stroke="#34d399" stroke-width="2.5"/>
    <text x="32" y="318" class="code" fill="#34d399">7 gabi@exemplo.com</text>
    <text x="282" y="318" class="t" fill="#34d399">achou</text>
  </g>
  <text x="190" y="400" text-anchor="middle" class="m">8 leituras, uma por linha</text>

  <text x="545" y="64" text-anchor="middle" class="t">Com índice B-tree</text>
  <g class="i1">
    <rect x="390" y="84" width="310" height="36" rx="8" class="box" stroke="#a78bfa"/>
    <text x="545" y="109" text-anchor="middle" class="n">raiz: a–f | g–h</text>
  </g>
  <path d="M545 120 L460 152 M545 120 L625 152" class="ln"/>
  <g class="dim">
    <rect x="390" y="152" width="140" height="36" rx="8" class="box"/>
    <text x="460" y="177" text-anchor="middle" class="n">ana–fabio</text>
  </g>
  <g class="i2">
    <rect x="550" y="152" width="150" height="36" rx="8" class="box" stroke="#a78bfa"/>
    <text x="625" y="177" text-anchor="middle" class="n">gabi–helena</text>
  </g>
  <path d="M625 188 L625 236" class="ln"/>
  <g class="i3">
    <rect x="390" y="236" width="310" height="36" rx="8" fill="#34d399" fill-opacity=".18" stroke="#34d399" stroke-width="2.5"/>
    <text x="402" y="261" class="code" fill="#34d399">7 gabi@exemplo.com</text>
  </g>
  <text x="545" y="318" text-anchor="middle" class="m">raiz → folha → linha</text>
  <text x="545" y="400" text-anchor="middle" class="m">3 leituras, sempre</text>
</svg>
