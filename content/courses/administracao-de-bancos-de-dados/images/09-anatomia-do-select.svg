<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" font-family="Inter, system-ui, sans-serif">
  <title>Ordem em que você escreve as cláusulas de um SELECT e ordem em que o banco as executa, começando pelo FROM</title>
  <style>
    .t { fill: #e8edf7; font-size: 24px; font-weight: 700; }
    .n { fill: #b4bfd3; font-size: 22px; font-weight: 700; }
    .c { fill: #e8edf7; font-size: 22px; }
    .code { fill: #e8edf7; font-size: 22px; font-family: 'JetBrains Mono', Consolas, monospace; }
    .k { font-weight: 700; }
    .m { fill: #b4bfd3; font-size: 22px; }
    .box { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .arrow { stroke: #a78bfa; stroke-width: 3; fill: none; marker-end: url(#head); }
  </style>
  <defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
    <path d="M0,0 L14,7 L0,14 z" fill="#a78bfa"/></marker></defs>
  <rect width="720" height="390" rx="16" fill="#0b1020"/>

  <text x="175" y="40" text-anchor="middle" class="t">Como você escreve</text>
  <text x="545" y="40" text-anchor="middle" class="t">Como o banco executa</text>

  <rect x="20" y="66" width="310" height="46" rx="10" class="box"/>
  <text x="36" y="97" class="n">1</text>
  <text x="62" y="97" class="code"><tspan class="k" fill="#34d399">SELECT</tspan> nome, preco</text>

  <rect x="20" y="122" width="310" height="46" rx="10" class="box"/>
  <text x="36" y="153" class="n">2</text>
  <text x="62" y="153" class="code"><tspan class="k" fill="#60a5fa">FROM</tspan> produtos</text>

  <rect x="20" y="178" width="310" height="46" rx="10" class="box"/>
  <text x="36" y="209" class="n">3</text>
  <text x="62" y="209" class="code"><tspan class="k" fill="#fbbf24">WHERE</tspan> estoque &gt; 0</text>

  <rect x="20" y="234" width="310" height="46" rx="10" class="box"/>
  <text x="36" y="265" class="n">4</text>
  <text x="62" y="265" class="code"><tspan class="k" fill="#a78bfa">ORDER BY</tspan> preco DESC</text>

  <rect x="20" y="290" width="310" height="46" rx="10" class="box"/>
  <text x="36" y="321" class="n">5</text>
  <text x="62" y="321" class="code"><tspan class="k" fill="#f87171">LIMIT</tspan> 3</text>

  <path d="M338 201 L378 201" class="arrow"/>

  <rect x="390" y="66" width="310" height="46" rx="10" class="box"/>
  <text x="406" y="97" class="n">1</text>
  <text x="432" y="97" class="c"><tspan class="k" fill="#60a5fa">FROM</tspan> · tabela</text>

  <rect x="390" y="122" width="310" height="46" rx="10" class="box"/>
  <text x="406" y="153" class="n">2</text>
  <text x="432" y="153" class="c"><tspan class="k" fill="#fbbf24">WHERE</tspan> · filtra linhas</text>

  <rect x="390" y="178" width="310" height="46" rx="10" class="box"/>
  <text x="406" y="209" class="n">3</text>
  <text x="432" y="209" class="c"><tspan class="k" fill="#34d399">SELECT</tspan> · colunas</text>

  <rect x="390" y="234" width="310" height="46" rx="10" class="box"/>
  <text x="406" y="265" class="n">4</text>
  <text x="432" y="265" class="c"><tspan class="k" fill="#a78bfa">ORDER BY</tspan> · ordena</text>

  <rect x="390" y="290" width="310" height="46" rx="10" class="box"/>
  <text x="406" y="321" class="n">5</text>
  <text x="432" y="321" class="c"><tspan class="k" fill="#f87171">LIMIT</tspan> · corta</text>

  <text x="360" y="372" text-anchor="middle" class="m">O banco começa pelo FROM, não pelo SELECT</text>
</svg>
