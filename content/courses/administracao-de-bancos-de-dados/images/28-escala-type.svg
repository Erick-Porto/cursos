<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Inter, system-ui, sans-serif">
  <title>Escada da coluna type do EXPLAIN, do pior ao melhor: ALL, index, range, ref, eq_ref e const</title>
  <style>
    .h { fill: #e8edf7; font-size: 24px; font-weight: 700; }
    .t { fill: #e8edf7; font-size: 22px; font-weight: 700; }
    .m { fill: #b4bfd3; font-size: 22px; }
    .box { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .arrow { stroke: #a78bfa; stroke-width: 2.5; fill: none; marker-end: url(#head); }
  </style>
  <defs><marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect width="720" height="380" rx="16" fill="#0b1020"/>
  <text x="360" y="38" text-anchor="middle" class="h">type: cada degrau lê menos linhas</text>

  <!-- ALL -->
  <rect x="19" y="244" width="112" height="90" rx="8" class="box"/>
  <rect x="19" y="244" width="112" height="6" rx="3" fill="#f87171"/>
  <text x="75" y="276" text-anchor="middle" class="t">ALL</text>
  <text x="75" y="304" text-anchor="middle" class="m">tabela</text>
  <text x="75" y="330" text-anchor="middle" class="m">inteira</text>

  <!-- index -->
  <rect x="133" y="214" width="112" height="120" rx="8" class="box"/>
  <rect x="133" y="214" width="112" height="6" rx="3" fill="#fbbf24"/>
  <text x="189" y="246" text-anchor="middle" class="t">index</text>
  <text x="189" y="274" text-anchor="middle" class="m">índice</text>
  <text x="189" y="300" text-anchor="middle" class="m">inteiro</text>

  <!-- range -->
  <rect x="247" y="184" width="112" height="150" rx="8" class="box"/>
  <rect x="247" y="184" width="112" height="6" rx="3" fill="#fbbf24"/>
  <text x="303" y="216" text-anchor="middle" class="t">range</text>
  <text x="303" y="244" text-anchor="middle" class="m">faixa do</text>
  <text x="303" y="270" text-anchor="middle" class="m">índice</text>

  <!-- ref -->
  <rect x="361" y="154" width="112" height="180" rx="8" class="box"/>
  <rect x="361" y="154" width="112" height="6" rx="3" fill="#60a5fa"/>
  <text x="417" y="186" text-anchor="middle" class="t">ref</text>
  <text x="417" y="214" text-anchor="middle" class="m">linhas</text>
  <text x="417" y="240" text-anchor="middle" class="m">por chave</text>

  <!-- eq_ref -->
  <rect x="475" y="124" width="112" height="210" rx="8" class="box"/>
  <rect x="475" y="124" width="112" height="6" rx="3" fill="#34d399"/>
  <text x="531" y="156" text-anchor="middle" class="t">eq_ref</text>
  <text x="531" y="184" text-anchor="middle" class="m">uma linha</text>
  <text x="531" y="210" text-anchor="middle" class="m">por chave</text>

  <!-- const -->
  <rect x="589" y="94" width="112" height="240" rx="8" class="box"/>
  <rect x="589" y="94" width="112" height="6" rx="3" fill="#34d399"/>
  <text x="645" y="126" text-anchor="middle" class="t">const</text>
  <text x="645" y="154" text-anchor="middle" class="m">uma linha</text>
  <text x="645" y="180" text-anchor="middle" class="m">uma vez</text>

  <text x="19" y="364" class="t" fill="#f87171">pior</text>
  <path d="M80 357 L616 357" class="arrow"/>
  <text x="701" y="364" text-anchor="end" class="t" fill="#34d399">melhor</text>
</svg>
