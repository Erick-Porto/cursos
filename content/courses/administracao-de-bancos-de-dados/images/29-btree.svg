<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Inter, system-ui, sans-serif">
  <title>B-tree simplificada: a raiz aponta para nós internos, que apontam para folhas ordenadas e encadeadas; a folha encontrada aponta para a linha na tabela. O caminho da busca por 57 está destacado</title>
  <style>
    .h { fill: #e8edf7; font-size: 24px; font-weight: 700; }
    .t { fill: #e8edf7; font-size: 22px; font-weight: 700; }
    .m { fill: #b4bfd3; font-size: 22px; }
    .box { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .hit { fill: #131c33; stroke: #34d399; stroke-width: 3; }
    .edge { stroke: #2a3a5c; stroke-width: 2; }
    .path { stroke: #34d399; stroke-width: 3; }
    .chain { stroke: #a78bfa; stroke-width: 2.5; fill: none; marker-end: url(#head); }
  </style>
  <defs><marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect width="720" height="420" rx="16" fill="#0b1020"/>
  <text x="360" y="38" text-anchor="middle" class="h">Busca por 57: raiz, nó interno, folha, linha</text>

  <!-- rótulos laterais -->
  <text x="16" y="112" class="m">raiz</text>
  <text x="16" y="192" class="m">internos</text>
  <text x="16" y="272" class="m">folhas</text>
  <text x="16" y="364" class="m">linhas</text>

  <!-- arestas -->
  <line x1="410" y1="126" x2="260" y2="162" class="edge"/>
  <line x1="410" y1="126" x2="560" y2="162" class="path"/>
  <line x1="260" y1="206" x2="185" y2="242" class="edge"/>
  <line x1="260" y1="206" x2="335" y2="242" class="edge"/>
  <line x1="560" y1="206" x2="485" y2="242" class="path"/>
  <line x1="560" y1="206" x2="635" y2="242" class="edge"/>
  <line x1="485" y1="286" x2="485" y2="334" class="path"/>

  <!-- raiz -->
  <rect x="350" y="82" width="120" height="44" rx="8" class="hit"/>
  <text x="410" y="112" text-anchor="middle" class="t">57</text>

  <!-- internos -->
  <rect x="210" y="162" width="100" height="44" rx="8" class="box"/>
  <text x="260" y="192" text-anchor="middle" class="t">31</text>
  <rect x="510" y="162" width="100" height="44" rx="8" class="hit"/>
  <text x="560" y="192" text-anchor="middle" class="t">78</text>

  <!-- folhas -->
  <rect x="120" y="242" width="130" height="44" rx="8" class="box"/>
  <text x="185" y="272" text-anchor="middle" class="t">5 12 20</text>
  <rect x="270" y="242" width="130" height="44" rx="8" class="box"/>
  <text x="335" y="272" text-anchor="middle" class="t">31 44 49</text>
  <rect x="420" y="242" width="130" height="44" rx="8" class="hit"/>
  <text x="485" y="272" text-anchor="middle" class="t">57 63 70</text>
  <rect x="570" y="242" width="130" height="44" rx="8" class="box"/>
  <text x="635" y="272" text-anchor="middle" class="t">78 85 91</text>

  <!-- encadeamento das folhas -->
  <path d="M335 304 L628 304" class="chain"/>
  <text x="120" y="312" class="m">encadeadas</text>

  <!-- linhas da tabela -->
  <rect x="120" y="334" width="580" height="44" rx="8" class="box"/>
  <text x="410" y="364" text-anchor="middle" class="m">linhas da tabela, na ordem da chave primária</text>

  <text x="360" y="406" text-anchor="middle" class="m">verde: três leituras para achar 57 entre um milhão</text>
</svg>
