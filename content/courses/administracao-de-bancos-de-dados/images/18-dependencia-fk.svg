<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" font-family="Inter, system-ui, sans-serif">
  <title>A tabela funcionarios aponta para departamentos pela chave estrangeira; DROP TABLE departamentos é recusado até remover a FK ou a tabela filha</title>
  <style>
    .t { fill: #e8edf7; font-size: 24px; font-weight: 700; }
    .b { fill: #34d399; font-size: 22px; font-weight: 700; }
    .m { fill: #b4bfd3; font-size: 22px; }
    .code { fill: #f87171; font-family: 'JetBrains Mono', Consolas, monospace; font-size: 22px; }
    .box { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .arrow { stroke: #a78bfa; stroke-width: 2.5; fill: none; marker-end: url(#head); }
    .step { stroke: #34d399; stroke-width: 2.5; fill: none; marker-end: url(#headok); }
  </style>
  <defs>
    <marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
    <marker id="headok" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
  </defs>
  <rect width="720" height="290" rx="16" fill="#0b1020"/>

  <rect x="40" y="70" width="220" height="90" rx="12" class="box"/>
  <text x="150" y="108" text-anchor="middle" class="t">funcionarios</text>
  <text x="150" y="140" text-anchor="middle" class="m">departamento_id</text>

  <path d="M260 115 L452 115" class="arrow"/>
  <text x="360" y="102" text-anchor="middle" class="m">chave estrangeira</text>

  <rect x="460" y="70" width="220" height="90" rx="12" class="box" stroke="#f87171"/>
  <text x="570" y="108" text-anchor="middle" class="t">departamentos</text>
  <text x="570" y="140" text-anchor="middle" class="m">id</text>

  <rect x="400" y="14" width="300" height="38" rx="8" fill="#f87171" fill-opacity=".15" stroke="#f87171"/>
  <text x="550" y="41" text-anchor="middle" class="code">DROP: ERROR 3730</text>

  <text x="40" y="200" class="m">Ordem segura</text>
  <rect x="40" y="214" width="300" height="50" rx="10" class="box" stroke="#34d399"/>
  <text x="190" y="247" text-anchor="middle" class="b">1. DROP FOREIGN KEY</text>
  <path d="M340 239 L392 239" class="step"/>
  <rect x="400" y="214" width="300" height="50" rx="10" class="box" stroke="#34d399"/>
  <text x="550" y="247" text-anchor="middle" class="b">2. DROP da tabela pai</text>
</svg>
