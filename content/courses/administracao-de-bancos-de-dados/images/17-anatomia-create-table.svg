<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 416" font-family="Inter, system-ui, sans-serif">
  <title>Anatomia de um CREATE TABLE: nome da tabela, colunas com tipo e constraints de coluna, e constraints de tabela no fim</title>
  <style>
    .code { fill: #e8edf7; font-family: 'JetBrains Mono', Consolas, monospace; font-size: 22px; }
    .kw { fill: #b4bfd3; }
    .lg { fill: #e8edf7; font-size: 22px; }
    .box { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
  </style>
  <rect width="720" height="416" rx="16" fill="#0b1020"/>

  <rect x="20" y="24" width="680" height="292" rx="12" class="box"/>

  <rect x="202" y="38" width="168" height="28" rx="5" fill="#34d399" fill-opacity=".15" stroke="#34d399"/>
  <text x="36" y="58" class="code kw" textLength="158" lengthAdjust="spacingAndGlyphs">CREATE TABLE</text>
  <text x="207" y="58" class="code" fill="#34d399" textLength="158" lengthAdjust="spacingAndGlyphs">funcionarios</text>
  <text x="378" y="58" class="code">(</text>

  <rect x="57" y="72" width="63" height="28" rx="5" fill="#60a5fa" fill-opacity=".15" stroke="#60a5fa"/>
  <rect x="123" y="72" width="168" height="28" rx="5" fill="#a78bfa" fill-opacity=".15" stroke="#a78bfa"/>
  <rect x="294" y="72" width="116" height="28" rx="5" fill="#fbbf24" fill-opacity=".15" stroke="#fbbf24"/>
  <text x="62" y="92" class="code" fill="#60a5fa" textLength="53" lengthAdjust="spacingAndGlyphs">nome</text>
  <text x="128" y="92" class="code" fill="#a78bfa" textLength="158" lengthAdjust="spacingAndGlyphs">VARCHAR(120)</text>
  <text x="299" y="92" class="code" fill="#fbbf24" textLength="106" lengthAdjust="spacingAndGlyphs">NOT NULL</text>
  <text x="412" y="92" class="code">,</text>

  <text x="62" y="126" class="code">salario DECIMAL(10,2),</text>
  <text x="62" y="160" class="code">departamento_id INT,</text>

  <rect x="50" y="174" width="566" height="102" rx="8" fill="#f87171" fill-opacity=".06" stroke="#f87171" stroke-dasharray="6 5"/>
  <text x="62" y="194" class="code">CONSTRAINT fk_funcionarios_departamento</text>
  <text x="88" y="228" class="code">FOREIGN KEY (departamento_id)</text>
  <text x="88" y="262" class="code">REFERENCES departamentos(id)</text>

  <text x="36" y="296" class="code">);</text>

  <rect x="36" y="338" width="18" height="18" rx="4" fill="#34d399"/>
  <text x="62" y="353" class="lg">nome da tabela</text>
  <rect x="250" y="338" width="18" height="18" rx="4" fill="#60a5fa"/>
  <text x="276" y="353" class="lg">coluna</text>
  <rect x="380" y="338" width="18" height="18" rx="4" fill="#a78bfa"/>
  <text x="406" y="353" class="lg">tipo</text>

  <rect x="36" y="378" width="18" height="18" rx="4" fill="#fbbf24"/>
  <text x="62" y="393" class="lg">constraint de coluna</text>
  <rect x="330" y="378" width="18" height="18" rx="4" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="356" y="393" class="lg">constraint de tabela, nomeada</text>
</svg>
