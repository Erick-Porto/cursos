<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" font-family="Inter, system-ui, sans-serif">
  <title>Linha do tempo da execução de um SELECT: o apelido nasce no SELECT, o WHERE roda antes e não o conhece, o ORDER BY roda depois e o aceita</title>
  <style>
    .t { fill: #e8edf7; font-size: 24px; font-weight: 700; }
    .k { fill: #e8edf7; font-size: 22px; font-weight: 700; font-family: 'JetBrains Mono', Consolas, monospace; }
    .n { fill: #b4bfd3; font-size: 22px; font-weight: 700; }
    .m { fill: #b4bfd3; font-size: 22px; }
    .bad { fill: #f87171; font-size: 22px; font-weight: 700; }
    .ok { fill: #34d399; font-size: 22px; font-weight: 700; }
    .box { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .s-red { stroke: #f87171; stroke-width: 2.5; }
    .s-green { stroke: #34d399; stroke-width: 2.5; }
  </style>
  <rect width="720" height="350" rx="16" fill="#0b1020"/>

  <text x="360" y="38" text-anchor="middle" class="t">Ordem de execução</text>

  <text x="24" y="89" class="n">1</text>
  <rect x="52" y="58" width="190" height="46" rx="10" class="box"/>
  <text x="147" y="89" text-anchor="middle" class="k">FROM</text>
  <text x="262" y="89" class="m">lê produtos</text>

  <text x="24" y="145" class="n">2</text>
  <rect x="52" y="114" width="190" height="46" rx="10" class="box s-red"/>
  <text x="147" y="145" text-anchor="middle" class="k">WHERE</text>
  <text x="262" y="145" class="bad">apelido ainda não existe</text>

  <text x="24" y="201" class="n">3</text>
  <rect x="52" y="170" width="190" height="46" rx="10" class="box s-green"/>
  <text x="147" y="201" text-anchor="middle" class="k">SELECT</text>
  <text x="262" y="201" class="ok">AS valor_estoque cria o apelido</text>

  <text x="24" y="257" class="n">4</text>
  <rect x="52" y="226" width="190" height="46" rx="10" class="box s-green"/>
  <text x="147" y="257" text-anchor="middle" class="k">ORDER BY</text>
  <text x="262" y="257" class="ok">já conhece o apelido</text>

  <text x="24" y="313" class="n">5</text>
  <rect x="52" y="282" width="190" height="46" rx="10" class="box"/>
  <text x="147" y="313" text-anchor="middle" class="k">LIMIT</text>
  <text x="262" y="313" class="m">corta o resultado</text>
</svg>
