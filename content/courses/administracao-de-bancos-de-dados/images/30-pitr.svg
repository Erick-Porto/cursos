<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Inter, system-ui, sans-serif">
  <title>Point-in-Time Recovery: restaurar o backup completo das 02:00, reaplicar o binary log até 14:31 e parar antes do DELETE errado das 14:32</title>
  <style>
    .h { fill: #e8edf7; font-size: 24px; font-weight: 700; }
    .t { fill: #e8edf7; font-size: 22px; font-weight: 700; }
    .m { fill: #b4bfd3; font-size: 18px; }
    .box { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .arrow { stroke: #a78bfa; stroke-width: 2.5; fill: none; marker-end: url(#head); }
  </style>
  <defs><marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect width="720" height="300" rx="16" fill="#0b1020"/>
  <text x="360" y="40" text-anchor="middle" class="h">Point-in-Time Recovery</text>

  <rect x="24" y="66" width="200" height="90" rx="12" class="box"/>
  <text x="124" y="104" text-anchor="middle" class="t">1. Restaurar</text>
  <text x="124" y="134" text-anchor="middle" class="m">backup das 02:00</text>

  <rect x="260" y="66" width="200" height="90" rx="12" class="box"/>
  <text x="360" y="104" text-anchor="middle" class="t">2. Reaplicar</text>
  <text x="360" y="134" text-anchor="middle" class="m">binlog até 14:31</text>

  <rect x="496" y="66" width="200" height="90" rx="12" class="box" stroke="#34d399"/>
  <text x="596" y="104" text-anchor="middle" class="t">Banco às 14:31</text>
  <text x="596" y="134" text-anchor="middle" class="m">antes do erro</text>

  <path d="M226 111 L252 111" class="arrow"/>
  <path d="M462 111 L488 111" class="arrow"/>

  <rect x="150" y="196" width="420" height="76" rx="12" fill="#131c33" stroke="#f87171" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="360" y="228" text-anchor="middle" fill="#f87171" font-size="22" font-weight="700">14:32: DELETE sem WHERE</text>
  <text x="360" y="256" text-anchor="middle" class="m">o log para antes deste comando</text>
</svg>
