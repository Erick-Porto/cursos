<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Inter, system-ui, sans-serif">
  <title>Animação: UPDATE sem WHERE zera o estoque das seis linhas de produtos de uma vez; com WHERE id = 5, só a linha do notebook muda</title>
  <style>
    .h { fill: #b4bfd3; font-size: 18px; font-weight: 700; }
    .c { fill: #e8edf7; font-size: 22px; }
    .code { fill: #e8edf7; font-family: 'JetBrains Mono', Consolas, monospace; font-size: 18px; }
    .box { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .pill { font-size: 22px; font-weight: 700; fill: #06281c; }
    .rows { font-size: 20px; font-weight: 700; }
    .before { animation: antes 7s infinite; }
    .after { animation: depois 7s infinite; opacity: 0; }
    @keyframes antes { 0%, 28% { opacity: 1; } 34%, 92% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes depois { 0%, 28% { opacity: 0; } 34%, 92% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .before, .after { animation: none !important; }
      .before { opacity: 0 !important; }
      .after { opacity: 1 !important; }
    }
  </style>
  <rect width="720" height="420" rx="16" fill="#0b1020"/>

  <!-- sem WHERE -->
  <text x="185" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#f87171">Sem WHERE</text>
  <text x="185" y="70" text-anchor="middle" class="code">UPDATE produtos</text>
  <text x="185" y="94" text-anchor="middle" class="code">SET estoque = 0;</text>
  <rect x="20" y="110" width="330" height="262" rx="12" class="box"/>
  <text x="56" y="136" text-anchor="middle" class="h">id</text>
  <text x="90" y="136" class="h">nome</text>
  <text x="300" y="136" text-anchor="middle" class="h">estoque</text>
  <line x1="32" y1="146" x2="338" y2="146" stroke="#2a3a5c" stroke-width="1.5"/>
  <g class="after">
    <rect x="270" y="154" width="60" height="30" rx="6" fill="#f87171"/>
    <rect x="270" y="190" width="60" height="30" rx="6" fill="#f87171"/>
    <rect x="270" y="226" width="60" height="30" rx="6" fill="#f87171"/>
    <rect x="270" y="262" width="60" height="30" rx="6" fill="#f87171"/>
    <rect x="270" y="298" width="60" height="30" rx="6" fill="#f87171"/>
    <rect x="270" y="334" width="60" height="30" rx="6" fill="#f87171"/>
  </g>
  <g class="c">
    <text x="56" y="177" text-anchor="middle">1</text><text x="90" y="177">Teclado</text>
    <text x="56" y="213" text-anchor="middle">2</text><text x="90" y="213">Mouse</text>
    <text x="56" y="249" text-anchor="middle">3</text><text x="90" y="249">Monitor 27"</text>
    <text x="56" y="285" text-anchor="middle">4</text><text x="90" y="285">Cadeira</text>
    <text x="56" y="321" text-anchor="middle">5</text><text x="90" y="321">Notebook</text>
    <text x="56" y="357" text-anchor="middle">6</text><text x="90" y="357">Webcam</text>
  </g>
  <g class="before c">
    <text x="300" y="177" text-anchor="middle">35</text>
    <text x="300" y="213" text-anchor="middle">50</text>
    <text x="300" y="249" text-anchor="middle">12</text>
    <text x="300" y="285" text-anchor="middle">8</text>
    <text x="300" y="321" text-anchor="middle">5</text>
    <text x="300" y="357" text-anchor="middle">0</text>
  </g>
  <g class="after pill">
    <text x="300" y="177" text-anchor="middle">0</text>
    <text x="300" y="213" text-anchor="middle">0</text>
    <text x="300" y="249" text-anchor="middle">0</text>
    <text x="300" y="285" text-anchor="middle">0</text>
    <text x="300" y="321" text-anchor="middle">0</text>
    <text x="300" y="357" text-anchor="middle">0</text>
  </g>
  <text x="185" y="404" text-anchor="middle" class="after rows" fill="#f87171">Rows matched: 6  Changed: 5</text>

  <!-- com WHERE -->
  <text x="535" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#34d399">Com WHERE</text>
  <text x="535" y="70" text-anchor="middle" class="code">UPDATE produtos</text>
  <text x="535" y="94" text-anchor="middle" class="code">SET estoque = 0 WHERE id = 5;</text>
  <rect x="370" y="110" width="330" height="262" rx="12" class="box"/>
  <text x="406" y="136" text-anchor="middle" class="h">id</text>
  <text x="440" y="136" class="h">nome</text>
  <text x="650" y="136" text-anchor="middle" class="h">estoque</text>
  <line x1="382" y1="146" x2="688" y2="146" stroke="#2a3a5c" stroke-width="1.5"/>
  <g class="after">
    <rect x="620" y="298" width="60" height="30" rx="6" fill="#34d399"/>
  </g>
  <g class="c">
    <text x="406" y="177" text-anchor="middle">1</text><text x="440" y="177">Teclado</text><text x="650" y="177" text-anchor="middle">35</text>
    <text x="406" y="213" text-anchor="middle">2</text><text x="440" y="213">Mouse</text><text x="650" y="213" text-anchor="middle">50</text>
    <text x="406" y="249" text-anchor="middle">3</text><text x="440" y="249">Monitor 27"</text><text x="650" y="249" text-anchor="middle">12</text>
    <text x="406" y="285" text-anchor="middle">4</text><text x="440" y="285">Cadeira</text><text x="650" y="285" text-anchor="middle">8</text>
    <text x="406" y="321" text-anchor="middle">5</text><text x="440" y="321">Notebook</text>
    <text x="406" y="357" text-anchor="middle">6</text><text x="440" y="357">Webcam</text><text x="650" y="357" text-anchor="middle">0</text>
  </g>
  <text x="650" y="321" text-anchor="middle" class="before c">5</text>
  <text x="650" y="321" text-anchor="middle" class="after pill">0</text>
  <text x="535" y="404" text-anchor="middle" class="after rows" fill="#34d399">Rows matched: 1  Changed: 1</text>
</svg>
