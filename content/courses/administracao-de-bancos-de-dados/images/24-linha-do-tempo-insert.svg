<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Inter, system-ui, sans-serif">
  <title>Linha do tempo de um INSERT: o trigger BEFORE roda antes da gravação e o trigger AFTER roda depois, tudo na mesma transação</title>
  <style>
    .t { fill: #e8edf7; font-size: 22px; font-weight: 700; }
    .m { fill: #b4bfd3; font-size: 18px; }
    .code { fill: #e8edf7; font-size: 20px; font-family: 'JetBrains Mono', Consolas, monospace; }
    .num { fill: #34d399; font-size: 22px; font-weight: 700; }
    .box { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .step { opacity: .35; animation-duration: 6s; animation-iteration-count: infinite; }
    .s1 { animation-name: p1; }
    .s2 { animation-name: p2; }
    .s3 { animation-name: p3; }
    @keyframes p1 { 0% { opacity: .35 } 8%, 90% { opacity: 1 } 100% { opacity: .35 } }
    @keyframes p2 { 0%, 33% { opacity: .35 } 41%, 90% { opacity: 1 } 100% { opacity: .35 } }
    @keyframes p3 { 0%, 66% { opacity: .35 } 74%, 90% { opacity: 1 } 100% { opacity: .35 } }
    @media (prefers-reduced-motion: reduce) { .step { animation: none !important; opacity: 1 !important; } }
  </style>
  <rect width="720" height="320" rx="16" fill="#0b1020"/>
  <text x="40" y="48" class="code">INSERT INTO produtos ... VALUES (...);</text>
  <line x1="40" y1="222" x2="680" y2="222" stroke="#2a3a5c" stroke-width="3"/>
  <text x="40" y="254" class="m">comando chega</text>
  <text x="680" y="254" text-anchor="end" class="m">resposta: OK</text>
  <g class="step s1">
    <rect x="40" y="80" width="200" height="100" rx="12" class="box"/>
    <text x="140" y="112" text-anchor="middle" class="num">1</text>
    <text x="140" y="142" text-anchor="middle" class="t">BEFORE INSERT</text>
    <text x="140" y="168" text-anchor="middle" class="m">valida e ajusta NEW</text>
    <circle cx="140" cy="222" r="8" fill="#a78bfa"/>
  </g>
  <g class="step s2">
    <rect x="260" y="80" width="200" height="100" rx="12" class="box"/>
    <text x="360" y="112" text-anchor="middle" class="num">2</text>
    <text x="360" y="142" text-anchor="middle" class="t">Gravação</text>
    <text x="360" y="168" text-anchor="middle" class="m">linha entra na tabela</text>
    <circle cx="360" cy="222" r="8" fill="#34d399"/>
  </g>
  <g class="step s3">
    <rect x="480" y="80" width="200" height="100" rx="12" class="box"/>
    <text x="580" y="112" text-anchor="middle" class="num">3</text>
    <text x="580" y="142" text-anchor="middle" class="t">AFTER INSERT</text>
    <text x="580" y="168" text-anchor="middle" class="m">registra o log</text>
    <circle cx="580" cy="222" r="8" fill="#a78bfa"/>
  </g>
  <path d="M240 130 L260 130 M460 130 L480 130" stroke="#a78bfa" stroke-width="2.5"/>
  <text x="360" y="300" text-anchor="middle" class="m">Mesma transação: erro no BEFORE ou no AFTER desfaz a gravação</text>
</svg>
