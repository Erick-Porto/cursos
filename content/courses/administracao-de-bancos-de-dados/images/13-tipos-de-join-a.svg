<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Inter, system-ui, sans-serif">
  <title>INNER JOIN e LEFT JOIN como diagramas de conjuntos: o INNER devolve só a interseção de A e B; o LEFT devolve todo o conjunto A</title>
  <style>
    .t { fill: #e8edf7; font-size: 22px; font-weight: 700; }
    .m { fill: #b4bfd3; font-size: 22px; }
    .s { fill: #b4bfd3; font-size: 18px; }
    .ab { fill: #e8edf7; font-size: 22px; font-weight: 700; }
    .box { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .ring { fill: none; stroke: #b4bfd3; stroke-width: 2; }
    .hi { fill: #34d399; opacity: .55; }
  </style>
  <defs>
    <clipPath id="ca"><circle cx="149" cy="166" r="64"/></clipPath>
  </defs>
  <rect width="720" height="340" rx="16" fill="#0b1020"/>

  <!-- INNER JOIN -->
  <rect x="20" y="20" width="330" height="280" rx="12" class="box"/>
  <text x="185" y="58" text-anchor="middle" class="t">INNER JOIN</text>
  <circle cx="221" cy="166" r="64" class="hi" clip-path="url(#ca)"/>
  <circle cx="149" cy="166" r="64" class="ring"/>
  <circle cx="221" cy="166" r="64" class="ring"/>
  <text x="118" y="174" text-anchor="middle" class="ab">A</text>
  <text x="252" y="174" text-anchor="middle" class="ab">B</text>
  <text x="185" y="276" text-anchor="middle" class="m">só os pares</text>

  <!-- LEFT JOIN -->
  <rect x="370" y="20" width="330" height="280" rx="12" class="box"/>
  <text x="535" y="58" text-anchor="middle" class="t">LEFT JOIN</text>
  <circle cx="499" cy="166" r="64" class="hi"/>
  <circle cx="499" cy="166" r="64" class="ring"/>
  <circle cx="571" cy="166" r="64" class="ring"/>
  <text x="468" y="174" text-anchor="middle" class="ab">A</text>
  <text x="602" y="174" text-anchor="middle" class="ab">B</text>
  <text x="535" y="276" text-anchor="middle" class="m">todos de A, com ou sem par</text>

  <text x="360" y="328" text-anchor="middle" class="s">A: tabela do FROM · B: tabela do JOIN · verde: entra no resultado</text>
</svg>
