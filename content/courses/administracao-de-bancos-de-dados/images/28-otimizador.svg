<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Inter, system-ui, sans-serif">
  <title>Fluxo: a consulta SQL entra no otimizador, que usa estatísticas e índices para escolher o plano de execução de menor custo</title>
  <style>
    .h { fill: #e8edf7; font-size: 24px; font-weight: 700; }
    .t { fill: #e8edf7; font-size: 22px; font-weight: 700; }
    .m { fill: #b4bfd3; font-size: 22px; }
    .box { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .arrow { stroke: #a78bfa; stroke-width: 2.5; fill: none; marker-end: url(#head); }
  </style>
  <defs><marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
  <rect width="720" height="300" rx="16" fill="#0b1020"/>
  <text x="360" y="38" text-anchor="middle" class="h">O otimizador escolhe o caminho</text>

  <rect x="20" y="118" width="180" height="80" rx="12" class="box"/>
  <text x="110" y="151" text-anchor="middle" class="t">Consulta SQL</text>
  <text x="110" y="179" text-anchor="middle" class="m">o que buscar</text>

  <rect x="240" y="118" width="200" height="80" rx="12" class="box" stroke="#a78bfa"/>
  <text x="340" y="151" text-anchor="middle" class="t">Otimizador</text>
  <text x="340" y="179" text-anchor="middle" class="m">compara custos</text>

  <rect x="480" y="118" width="220" height="80" rx="12" class="box"/>
  <text x="590" y="151" text-anchor="middle" class="t">Plano escolhido</text>
  <text x="590" y="179" text-anchor="middle" class="m">EXPLAIN mostra</text>

  <path d="M200 158 L232 158" class="arrow"/>
  <path d="M440 158 L472 158" class="arrow"/>

  <rect x="240" y="52" width="200" height="44" rx="10" class="box"/>
  <text x="340" y="82" text-anchor="middle" class="t" fill="#60a5fa">Estatísticas</text>
  <path d="M340 96 L340 110" class="arrow"/>

  <rect x="240" y="222" width="200" height="44" rx="10" class="box"/>
  <text x="340" y="252" text-anchor="middle" class="t" fill="#34d399">Índices</text>
  <path d="M340 222 L340 206" class="arrow"/>
</svg>
