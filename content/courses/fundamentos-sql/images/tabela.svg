<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Inter, system-ui, sans-serif">
  <title>Tabela clientes: cada coluna é uma característica e cada linha é um registro</title>
  <style>
    .t { fill: #e8edf7; font-size: 22px; }
    .h { fill: #06281c; font-size: 22px; font-weight: 700; }
    .lbl { fill: #a78bfa; font-size: 18px; font-weight: 700; }
    .cell { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .head { fill: #34d399; }
    .line { stroke: #a78bfa; stroke-width: 2; fill: none; }
  </style>
  <rect width="720" height="300" rx="16" fill="#0b1020"/>

  <!-- rótulo tabela -->
  <text x="40" y="44" class="lbl">tabela: clientes</text>

  <!-- cabeçalho -->
  <rect x="40" y="60" width="120" height="44" class="head"/>
  <rect x="160" y="60" width="260" height="44" class="head"/>
  <rect x="420" y="60" width="260" height="44" class="head"/>
  <text x="56" y="89" class="h">id</text>
  <text x="176" y="89" class="h">nome</text>
  <text x="436" y="89" class="h">cidade</text>

  <!-- linhas -->
  <g>
    <rect x="40" y="104" width="120" height="44" class="cell"/>
    <rect x="160" y="104" width="260" height="44" class="cell"/>
    <rect x="420" y="104" width="260" height="44" class="cell"/>
    <text x="56" y="133" class="t">1</text>
    <text x="176" y="133" class="t">Ana Souza</text>
    <text x="436" y="133" class="t">Rio de Janeiro</text>
  </g>
  <g>
    <rect x="40" y="148" width="120" height="44" class="cell"/>
    <rect x="160" y="148" width="260" height="44" class="cell"/>
    <rect x="420" y="148" width="260" height="44" class="cell"/>
    <text x="56" y="177" class="t">2</text>
    <text x="176" y="177" class="t">Bruno Lima</text>
    <text x="436" y="177" class="t">São Paulo</text>
  </g>
  <g>
    <rect x="40" y="192" width="120" height="44" class="cell"/>
    <rect x="160" y="192" width="260" height="44" class="cell"/>
    <rect x="420" y="192" width="260" height="44" class="cell"/>
    <text x="56" y="221" class="t">3</text>
    <text x="176" y="221" class="t">Carla Mendes</text>
    <text x="436" y="221" class="t">Recife</text>
  </g>

  <!-- legendas -->
  <text x="236" y="46" class="lbl">coluna</text>
  <path d="M 290 50 L 290 60" class="line"/>

  <text x="480" y="268" class="lbl">linha = um registro</text>
  <path d="M 600 254 L 600 238" class="line"/>
</svg>
