<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Inter, system-ui, sans-serif">
  <title>O certo: setDados recebe o paraJSON de comStatus('pago'), um objeto novo; o estado passa a apontar para ele, o React redesenha e o Badge mostra Pago</title>
  <style>
    .box  { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .lbl  { fill: #a78bfa; font-size: 22px; font-weight: 700; }
    .code { fill: #e8edf7; font-size: 22px; font-family: 'JetBrains Mono', Consolas, monospace; }
    .bold { fill: #e8edf7; font-size: 22px; font-weight: 700; font-family: 'JetBrains Mono', Consolas, monospace; }
    .m    { fill: #b4bfd3; font-size: 22px; }
    .ok   { fill: #34d399; font-size: 22px; font-weight: 700; font-family: 'JetBrains Mono', Consolas, monospace; }
    .yes  { fill: #34d399; font-size: 22px; font-weight: 700; }
    .badge { fill: #06281c; font-size: 22px; font-weight: 700; }
    .ref  { stroke: #34d399; stroke-width: 3; fill: none; marker-end: url(#seta); }
    .old  { stroke: #b4bfd3; stroke-width: 2; fill: none; stroke-dasharray: 6 5; opacity: 0.6; }
  </style>
  <defs>
    <marker id="seta" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#34d399"/></marker>
  </defs>
  <rect width="720" height="320" rx="16" fill="#0b1020"/>

  <text class="lbl" x="100" y="40" text-anchor="middle">estado</text>
  <text class="lbl" x="365" y="40" text-anchor="middle">dados simples</text>
  <text class="lbl" x="610" y="40" text-anchor="middle">tela</text>

  <!-- estado -->
  <rect class="box" x="30" y="94" width="140" height="64" rx="10"/>
  <text class="bold" x="100" y="134" text-anchor="middle">dados</text>
  <path class="old" d="M172 112 L226 86"/>
  <path class="ref" d="M172 140 L226 164"/>

  <!-- antes: o objeto antigo fica como estava -->
  <rect class="box" x="230" y="56" width="270" height="60" rx="10" opacity="0.6"/>
  <text class="m" x="248" y="94">status</text>
  <text class="code" x="340" y="94" opacity="0.6">'pendente'</text>

  <!-- depois: objeto novo -->
  <rect x="230" y="136" width="270" height="60" rx="10" fill="#131c33" stroke="#34d399" stroke-width="2.5"/>
  <text class="m" x="248" y="174">status</text>
  <text class="ok" x="340" y="174">'pago'</text>
  <text class="m" x="365" y="226" text-anchor="middle">objeto novo</text>

  <!-- a tela -->
  <rect x="540" y="56" width="140" height="140" rx="18" fill="#131c33" stroke="#34d399" stroke-width="2.5"/>
  <rect x="566" y="108" width="88" height="38" rx="19" fill="#34d399"/>
  <text class="badge" x="610" y="134" text-anchor="middle">Pago</text>
  <text class="yes" x="610" y="226" text-anchor="middle">mudou</text>

  <text class="code" x="30" y="268">setDados(pedido.comStatus('pago').paraJSON())</text>
  <text class="yes" x="30" y="302">objeto novo: o React redesenha</text>
</svg>
