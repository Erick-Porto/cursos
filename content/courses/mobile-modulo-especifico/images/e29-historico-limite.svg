<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Inter, system-ui, sans-serif">
  <title>registrarBusca com o histórico cheio: o unshift põe garrafa na frente, as outras buscas andam uma posição e o slice(0, 5) deixa livro de fora</title>
  <style>
    .cell { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .t    { fill: #e8edf7; font-size: 22px; }
    .new  { fill: #06281c; font-size: 22px; font-weight: 700; }
    .m    { fill: #b4bfd3; font-size: 22px; }
    .in   { fill: #34d399; font-size: 22px; font-weight: 700; font-family: 'JetBrains Mono', Consolas, monospace; }
    .lim  { fill: #a78bfa; font-size: 22px; font-weight: 700; font-family: 'JetBrains Mono', Consolas, monospace; }
    .res  { fill: #34d399; font-size: 22px; font-family: 'JetBrains Mono', Consolas, monospace; }
    .no   { fill: #f87171; font-size: 22px; font-weight: 700; }
    .frame { fill: none; stroke: #a78bfa; stroke-width: 2; stroke-dasharray: 8 5; }
    .ain  { stroke: #34d399; stroke-width: 3; fill: none; marker-end: url(#seta-in); }
    .novo  { animation: entra 8s infinite; }
    .anda  { animation: anda 8s infinite; }
    .corte { animation: corta 8s infinite; }
    @keyframes entra {
      0%, 10%  { opacity: 0; transform: translateY(-82px); }
      16%      { opacity: 1; transform: translateY(-82px); }
      34%, 92% { opacity: 1; transform: translateY(0); }
      100%     { opacity: 0; transform: translateY(0); }
    }
    @keyframes anda {
      0%       { opacity: 0; transform: translateX(-105px); }
      5%, 16%  { opacity: 1; transform: translateX(-105px); }
      34%, 92% { opacity: 1; transform: translateX(0); }
      100%     { opacity: 0; transform: translateX(0); }
    }
    @keyframes corta { 0%, 44% { opacity: 0; } 52%, 92% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .novo, .anda, .corte { animation: none; } }
  </style>
  <defs>
    <marker id="seta-in" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#34d399"/></marker>
  </defs>
  <rect width="720" height="320" rx="16" fill="#0b1020"/>

  <!-- entrada pelo começo -->
  <path class="ain" d="M95 52 L95 128"/>
  <text class="in" x="156" y="92">unshift</text>
  <text class="lim" x="566" y="118" text-anchor="end">slice(0, 5)</text>

  <!-- as 5 posições -->
  <rect class="cell" x="45" y="140" width="100" height="60" rx="8"/>
  <rect class="cell" x="150" y="140" width="100" height="60" rx="8"/>
  <rect class="cell" x="255" y="140" width="100" height="60" rx="8"/>
  <rect class="cell" x="360" y="140" width="100" height="60" rx="8"/>
  <rect class="cell" x="465" y="140" width="100" height="60" rx="8"/>
  <rect class="frame" x="38" y="132" width="534" height="76" rx="12"/>
  <text class="m" x="95" y="236" text-anchor="middle">0</text>
  <text class="m" x="200" y="236" text-anchor="middle">1</text>
  <text class="m" x="305" y="236" text-anchor="middle">2</text>
  <text class="m" x="410" y="236" text-anchor="middle">3</text>
  <text class="m" x="515" y="236" text-anchor="middle">4</text>

  <!-- buscas antigas: andam uma posição -->
  <g class="anda">
    <text class="t" x="200" y="178" text-anchor="middle">fone</text>
    <text class="t" x="305" y="178" text-anchor="middle">bola</text>
    <text class="t" x="410" y="178" text-anchor="middle">yoga</text>
    <text class="t" x="515" y="178" text-anchor="middle">panela</text>
    <text class="t" x="620" y="178" text-anchor="middle">livro</text>
  </g>

  <!-- busca nova -->
  <g class="novo">
    <rect x="49" y="144" width="92" height="52" rx="6" fill="#34d399"/>
    <text class="new" x="95" y="178" text-anchor="middle">garrafa</text>
  </g>

  <!-- o que passa do limite -->
  <g class="corte">
    <rect x="575" y="140" width="90" height="60" rx="8" fill="none" stroke="#f87171" stroke-width="2.5" stroke-dasharray="6 4"/>
    <path d="M590 171 L650 171" stroke="#f87171" stroke-width="3"/>
    <text class="no" x="620" y="236" text-anchor="middle">de fora</text>
    <text class="res" x="360" y="290" text-anchor="middle">['garrafa', 'fone', 'bola', 'yoga', 'panela']</text>
  </g>
</svg>
