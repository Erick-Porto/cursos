<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Inter, system-ui, sans-serif">
  <title>Componentes, estado, API e Git formam a base das três trilhas: React Native, nativo com Kotlin ou Swift e full stack com Node.js, banco de dados e API</title>
  <style>
    .base { fill: #131c33; stroke: #34d399; stroke-width: 2.5; }
    .box  { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .hb   { fill: #34d399; font-size: 22px; font-weight: 700; }
    .h    { fill: #e8edf7; font-size: 24px; font-weight: 700; }
    .t    { fill: #e8edf7; font-size: 22px; }
    .m    { fill: #b4bfd3; font-size: 22px; }
    .here { fill: #fbbf24; font-size: 22px; font-weight: 700; }
    .line { stroke: #a78bfa; stroke-width: 2.5; fill: none; marker-end: url(#seta); }
  </style>
  <defs>
    <marker id="seta" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#a78bfa"/></marker>
  </defs>
  <rect width="720" height="340" rx="16" fill="#0b1020"/>

  <!-- base comum -->
  <rect class="base" x="24" y="98" width="210" height="144" rx="12"/>
  <text class="hb" x="44" y="134">Base das três</text>
  <text class="t" x="44" y="170">componentes,</text>
  <text class="t" x="44" y="198">estado, API</text>
  <text class="t" x="44" y="226">e Git</text>

  <path class="line" d="M 234 170 C 262 170 262 62 286 62"/>
  <path class="line" d="M 234 170 L 286 170"/>
  <path class="line" d="M 234 170 C 262 170 262 278 286 278"/>

  <!-- trilhas -->
  <rect class="box" x="290" y="20" width="410" height="84" rx="12"/>
  <text class="h" x="310" y="54">React Native</text>
  <text class="here" x="684" y="54" text-anchor="end">você está aqui</text>
  <text class="m" x="310" y="88">TypeScript e recursos nativos</text>

  <rect class="box" x="290" y="128" width="410" height="84" rx="12"/>
  <text class="h" x="310" y="162">Nativo</text>
  <text class="m" x="310" y="196">Kotlin (Android) ou Swift (iOS)</text>

  <rect class="box" x="290" y="236" width="410" height="84" rx="12"/>
  <text class="h" x="310" y="270">Full stack</text>
  <text class="m" x="310" y="304">Node.js, banco de dados e API</text>
</svg>
