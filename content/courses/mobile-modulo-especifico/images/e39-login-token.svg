<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="Inter, system-ui, sans-serif">
  <title>Login com token: o app envia usuário e senha uma vez para POST /auth/login, recebe o token e o guarda no SecureStore; ao abrir de novo, lê o token salvo, chama GET /auth/me e recebe o usuário sem pedir a senha</title>
  <style>
    .box  { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .h    { fill: #34d399; font-size: 22px; font-weight: 700; }
    .t    { fill: #e8edf7; font-size: 22px; }
    .s    { fill: #b4bfd3; font-size: 22px; }
    .ok   { fill: #34d399; font-size: 22px; font-weight: 700; }
    .lbl  { fill: #a78bfa; font-size: 22px; font-weight: 700; }
    .mono { font-family: 'JetBrains Mono', Consolas, monospace; }
    .vida { stroke: #b4bfd3; stroke-width: 1.5; stroke-dasharray: 4 8; }
    .ida  { stroke: #60a5fa; stroke-width: 3; fill: none; marker-end: url(#p-ida); }
    .volta { stroke: #34d399; stroke-width: 3; fill: none; marker-end: url(#p-volta); }
    .cofre { stroke: #a78bfa; stroke-width: 3; fill: none; marker-end: url(#p-cofre); }
    .divisa { stroke: #a78bfa; stroke-width: 1.5; stroke-dasharray: 6 6; }
    .g1 { animation: g1 8s infinite; }
    .g2 { animation: g2 8s infinite; }
    .g3 { animation: g3 8s infinite; }
    @keyframes g1 { 0%, 4%  { opacity: 0; } 10%, 94% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes g2 { 0%, 28% { opacity: 0; } 34%, 94% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes g3 { 0%, 52% { opacity: 0; } 58%, 94% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .g1, .g2, .g3 { animation: none; }
    }
  </style>
  <defs>
    <marker id="p-ida" viewBox="0 0 10 10" markerWidth="6" markerHeight="6" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/></marker>
    <marker id="p-volta" viewBox="0 0 10 10" markerWidth="6" markerHeight="6" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
    <marker id="p-cofre" viewBox="0 0 10 10" markerWidth="6" markerHeight="6" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
  </defs>
  <rect width="720" height="480" rx="16" fill="#0b1020"/>

  <!-- participantes -->
  <rect class="box" x="22" y="20" width="180" height="44" rx="10"/>
  <text class="h" x="112" y="50" text-anchor="middle">SecureStore</text>
  <rect class="box" x="258" y="20" width="120" height="44" rx="10"/>
  <text class="h" x="318" y="50" text-anchor="middle">App</text>
  <rect class="box" x="524" y="20" width="172" height="44" rx="10"/>
  <text class="h" x="610" y="50" text-anchor="middle">DummyJSON</text>
  <line class="vida" x1="112" y1="64" x2="112" y2="466"/>
  <line class="vida" x1="318" y1="64" x2="318" y2="466"/>
  <line class="vida" x1="610" y1="64" x2="610" y2="466"/>

  <!-- 1: entrar, uma vez -->
  <g class="g1">
    <path class="ida" d="M 320 120 L 600 120"/>
    <text class="t mono" x="464" y="108" text-anchor="middle">POST /auth/login</text>
    <text class="s" x="464" y="146" text-anchor="middle">usuário e senha</text>
    <path class="volta" d="M 608 196 L 328 196"/>
    <text class="ok" x="464" y="184" text-anchor="middle">token</text>
  </g>

  <!-- 2: o token vai para o cofre -->
  <g class="g2">
    <path class="cofre" d="M 316 244 L 122 244"/>
    <text class="lbl" x="215" y="232" text-anchor="middle">guarda o token</text>
  </g>

  <!-- 3: o app abre de novo -->
  <g class="g3">
    <line class="divisa" x1="24" y1="278" x2="696" y2="278"/>
    <text class="lbl" x="464" y="306" text-anchor="middle">ao abrir o app de novo</text>
    <path class="cofre" d="M 114 356 L 308 356"/>
    <text class="lbl" x="215" y="344" text-anchor="middle">token salvo</text>
    <path class="ida" d="M 320 404 L 600 404"/>
    <text class="t mono" x="464" y="392" text-anchor="middle">GET /auth/me</text>
    <path class="volta" d="M 608 452 L 328 452"/>
    <text class="ok" x="464" y="440" text-anchor="middle">usuário: entra direto</text>
  </g>
</svg>
