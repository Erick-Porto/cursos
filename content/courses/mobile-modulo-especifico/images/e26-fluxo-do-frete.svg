<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 412" font-family="Inter, system-ui, sans-serif">
  <title>As guard clauses de calcularFrete como fluxo: CEP inválido sai com null; subtotal a partir de 150 sai com 0; o resto paga o valor da região em FRETE_POR_DIGITO</title>
  <style>
    .box  { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .dec  { fill: #131c33; stroke: #fbbf24; stroke-width: 2.5; }
    .nulo { fill: #131c33; stroke: #f87171; stroke-width: 2.5; stroke-dasharray: 8 5; }
    .zero { fill: #131c33; stroke: #34d399; stroke-width: 2.5; }
    .regiao { fill: #131c33; stroke: #60a5fa; stroke-width: 2.5; }
    .code { fill: #e8edf7; font-size: 22px; font-family: 'JetBrains Mono', Consolas, monospace; }
    .big  { font-size: 26px; font-weight: 700; font-family: 'JetBrains Mono', Consolas, monospace; }
    .lbl  { fill: #a78bfa; font-size: 22px; font-weight: 700; }
    .m    { fill: #b4bfd3; font-size: 22px; }
    .line { stroke: #a78bfa; stroke-width: 2.5; fill: none; marker-end: url(#seta); }
  </style>
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
  </defs>
  <rect width="720" height="412" rx="16" fill="#0b1020"/>

  <!-- entrada -->
  <rect class="box" x="30" y="20" width="400" height="52" rx="10"/>
  <text class="code" x="230" y="54" text-anchor="middle">calcularFrete(subtotal, cep)</text>
  <path class="line" d="M230 72 L230 98"/>

  <!-- guarda 1: o CEP -->
  <rect class="dec" x="80" y="104" width="300" height="56" rx="10"/>
  <text class="code" x="230" y="140" text-anchor="middle">cepValido?</text>
  <path class="line" d="M380 132 L494 132"/>
  <text class="lbl" x="436" y="120" text-anchor="middle">não</text>
  <rect class="nulo" x="500" y="104" width="180" height="56" rx="10"/>
  <text class="big" x="590" y="141" text-anchor="middle" fill="#f87171">null</text>
  <text class="m" x="590" y="190" text-anchor="middle">CEP ruim sai</text>

  <path class="line" d="M230 160 L230 210"/>
  <text class="lbl" x="244" y="194">sim</text>

  <!-- guarda 2: o frete grátis -->
  <rect class="dec" x="80" y="216" width="300" height="56" rx="10"/>
  <text class="code" x="230" y="252" text-anchor="middle">subtotal &gt;= 150?</text>
  <path class="line" d="M380 244 L494 244"/>
  <text class="lbl" x="436" y="232" text-anchor="middle">sim</text>
  <rect class="zero" x="500" y="216" width="180" height="56" rx="10"/>
  <text class="big" x="590" y="253" text-anchor="middle" fill="#34d399">0</text>
  <text class="m" x="590" y="302" text-anchor="middle">compra grande sai</text>

  <path class="line" d="M230 272 L230 322"/>
  <text class="lbl" x="244" y="306">não</text>

  <!-- caminho principal -->
  <rect class="regiao" x="30" y="328" width="400" height="56" rx="10"/>
  <text class="code" x="230" y="364" text-anchor="middle">FRETE_POR_DIGITO[digitos[0]]</text>
  <text class="m" x="590" y="364" text-anchor="middle">o resto paga a região</text>
</svg>
