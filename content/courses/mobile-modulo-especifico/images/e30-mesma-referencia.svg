<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" font-family="Inter, system-ui, sans-serif">
  <title>O erro: pedido.status = 'pago' muda o mesmo objeto guardado no estado; setPedido recebe a mesma referência, o React não redesenha e o Badge continua Pendente</title>
  <style>
    .box  { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .lbl  { fill: #a78bfa; font-size: 22px; font-weight: 700; }
    .code { fill: #e8edf7; font-size: 22px; font-family: 'JetBrains Mono', Consolas, monospace; }
    .bold { fill: #e8edf7; font-size: 22px; font-weight: 700; font-family: 'JetBrains Mono', Consolas, monospace; }
    .m    { fill: #b4bfd3; font-size: 22px; }
    .act  { fill: #fbbf24; font-size: 22px; font-family: 'JetBrains Mono', Consolas, monospace; }
    .ok   { fill: #34d399; font-size: 22px; font-weight: 700; font-family: 'JetBrains Mono', Consolas, monospace; }
    .no   { fill: #f87171; font-size: 22px; font-weight: 700; }
    .badge { fill: #0b1020; font-size: 22px; font-weight: 700; }
    .ref  { stroke: #a78bfa; stroke-width: 3; fill: none; marker-end: url(#seta); }
    .antigo { opacity: 0.6; animation: antigo 8s infinite; }
    .p1 { animation: p1 8s infinite; }
    .p2 { animation: p2 8s infinite; }
    .p3 { animation: p3 8s infinite; }
    @keyframes antigo { 0%, 12% { opacity: 1; } 18%, 100% { opacity: 0.6; } }
    @keyframes p1 { 0%, 12% { opacity: 0; } 18%, 92% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes p2 { 0%, 36% { opacity: 0; } 42%, 92% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes p3 { 0%, 60% { opacity: 0; } 66%, 92% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .antigo, .p1, .p2, .p3 { animation: none; } }
  </style>
  <defs>
    <marker id="seta" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#a78bfa"/></marker>
  </defs>
  <rect width="720" height="350" rx="16" fill="#0b1020"/>

  <text class="lbl" x="100" y="40" text-anchor="middle">estado</text>
  <text class="lbl" x="365" y="40" text-anchor="middle">instância</text>
  <text class="lbl" x="610" y="40" text-anchor="middle">tela</text>

  <!-- estado aponta para o objeto -->
  <rect class="box" x="30" y="78" width="140" height="64" rx="10"/>
  <text class="bold" x="100" y="118" text-anchor="middle">pedido</text>
  <path class="ref" d="M172 110 L226 110"/>

  <!-- o objeto Pedido -->
  <rect class="box" x="230" y="56" width="270" height="140" rx="12"/>
  <text class="bold" x="248" y="90">Pedido 1042</text>
  <text class="m" x="248" y="138">status</text>
  <text class="code antigo" x="340" y="138">'pendente'</text>
  <g class="p1">
    <path d="M336 130 L476 130" stroke="#f87171" stroke-width="3"/>
    <text class="ok" x="340" y="176">'pago'</text>
  </g>

  <!-- a tela -->
  <rect class="box" x="540" y="56" width="140" height="140" rx="18"/>
  <rect x="552" y="108" width="116" height="38" rx="19" fill="#fbbf24"/>
  <text class="badge" x="610" y="134" text-anchor="middle">Pendente</text>

  <!-- 1. muda por dentro -->
  <text class="act p1" x="30" y="248">pedido.status = 'pago'</text>
  <!-- 2. mesma referência -->
  <g class="p2">
    <text class="code" x="30" y="288">setPedido(pedido)</text>
    <text class="no" x="30" y="326">mesmo objeto: o React não redesenha</text>
  </g>
  <!-- 3. a tela não muda -->
  <g class="p3">
    <rect x="536" y="52" width="148" height="148" rx="20" fill="none" stroke="#f87171" stroke-width="3" stroke-dasharray="8 5"/>
    <text class="no" x="610" y="240" text-anchor="middle">não mudou</text>
  </g>
</svg>
