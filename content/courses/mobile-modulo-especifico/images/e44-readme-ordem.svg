<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Inter, system-ui, sans-serif">
  <title>O README na ordem de quem lê: nome, frase e vídeo, problema e solução e telas ficam acima do ponto em que a leitura para; como rodar, tecnologias e equipe vêm depois</title>
  <style>
    .box  { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .file { fill: #b4bfd3; font-size: 22px; font-family: 'JetBrains Mono', Consolas, monospace; }
    .top  { fill: #e8edf7; font-size: 22px; font-weight: 700; }
    .low  { fill: #b4bfd3; font-size: 22px; }
    .bar  { fill: #34d399; }
    .t    { fill: #e8edf7; font-size: 22px; }
    .warn { fill: #fbbf24; font-size: 22px; font-weight: 700; }
    .fold { stroke: #fbbf24; stroke-width: 2.5; stroke-dasharray: 9 6; }
    .brk  { stroke: #34d399; stroke-width: 2.5; fill: none; }
    .sep  { stroke: #2a3a5c; stroke-width: 1.5; }
  </style>
  <rect width="720" height="360" rx="16" fill="#0b1020"/>

  <rect class="box" x="32" y="24" width="404" height="312" rx="12"/>
  <text class="file" x="52" y="58">README.md</text>
  <line class="sep" x1="32" y1="74" x2="436" y2="74"/>

  <!-- acima do ponto em que a leitura para -->
  <rect class="bar" x="48" y="88" width="6" height="28" rx="3"/>
  <text class="top" x="68" y="110">Nome, frase e vídeo</text>
  <rect class="bar" x="48" y="126" width="6" height="28" rx="3"/>
  <text class="top" x="68" y="148">Problema</text>
  <rect class="bar" x="48" y="164" width="6" height="28" rx="3"/>
  <text class="top" x="68" y="186">Solução e telas</text>

  <line class="fold" x1="32" y1="212" x2="472" y2="212"/>

  <!-- abaixo -->
  <text class="low" x="68" y="248">Como rodar e APK</text>
  <text class="low" x="68" y="286">Tecnologias e decisões</text>
  <text class="low" x="68" y="324">Equipe</text>

  <path class="brk" d="M 452 88 L 462 88 L 462 192 L 452 192"/>
  <text class="t" x="482" y="134">os 30 segundos</text>
  <text class="t" x="482" y="162">de quem lê</text>

  <text class="warn" x="488" y="206">quem lê para</text>
  <text class="warn" x="488" y="234">no meio</text>
</svg>
