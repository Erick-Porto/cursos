<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Inter, system-ui, sans-serif">
  <title>reduce volta a volta: soma começa em 0; a volta 1 soma o fone (qtd 1) e devolve 1, a volta 2 soma as luminárias (qtd 2) e devolve 3, a volta 3 soma o livro (qtd 1) e devolve 4</title>
  <style>
    .box  { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .res  { fill: #34d399; }
    .n    { fill: #e8edf7; font-size: 22px; font-weight: 700; }
    .q    { fill: #a78bfa; font-size: 22px; font-family: 'JetBrains Mono', Consolas, monospace; }
    .s    { fill: #b4bfd3; font-size: 22px; font-family: 'JetBrains Mono', Consolas, monospace; }
    .sr   { fill: #06281c; font-size: 22px; font-family: 'JetBrains Mono', Consolas, monospace; }
    .v    { fill: #e8edf7; font-size: 32px; font-weight: 700; }
    .vr   { fill: #06281c; font-size: 32px; font-weight: 700; }
    .m    { fill: #b4bfd3; font-size: 22px; }
    .ok   { fill: #34d399; font-size: 22px; font-weight: 700; }
    .plus { fill: #a78bfa; font-size: 28px; font-weight: 700; }
    .line { stroke: #a78bfa; stroke-width: 2.5; fill: none; marker-end: url(#seta); }
    .v1 { animation: v1 8s infinite; }
    .v2 { animation: v2 8s infinite; }
    .v3 { animation: v3 8s infinite; }
    @keyframes v1 { 0%, 8%  { opacity: 0; transform: translateX(-14px); } 16%, 90% { opacity: 1; transform: translateX(0); } 97%, 100% { opacity: 0; transform: translateX(0); } }
    @keyframes v2 { 0%, 32% { opacity: 0; transform: translateX(-14px); } 40%, 90% { opacity: 1; transform: translateX(0); } 97%, 100% { opacity: 0; transform: translateX(0); } }
    @keyframes v3 { 0%, 56% { opacity: 0; transform: translateX(-14px); } 64%, 90% { opacity: 1; transform: translateX(0); } 97%, 100% { opacity: 0; transform: translateX(0); } }
    @media (prefers-reduced-motion: reduce) {
      .v1, .v2, .v3 { animation: none; }
    }
  </style>
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
  </defs>
  <rect width="720" height="320" rx="16" fill="#0b1020"/>

  <!-- itens do carrinho -->
  <rect class="box" x="95" y="20" width="150" height="88" rx="10"/>
  <text class="n" x="170" y="56" text-anchor="middle">fone</text>
  <text class="q" x="170" y="90" text-anchor="middle">qtd: 1</text>

  <rect class="box" x="285" y="20" width="150" height="88" rx="10"/>
  <text class="n" x="360" y="56" text-anchor="middle">luminária</text>
  <text class="q" x="360" y="90" text-anchor="middle">qtd: 2</text>

  <rect class="box" x="475" y="20" width="150" height="88" rx="10"/>
  <text class="n" x="550" y="56" text-anchor="middle">livro</text>
  <text class="q" x="550" y="90" text-anchor="middle">qtd: 1</text>

  <!-- acumulador: valor inicial -->
  <rect class="box" x="30" y="170" width="90" height="90" rx="10"/>
  <text class="s" x="75" y="200" text-anchor="middle">soma</text>
  <text class="v" x="75" y="244" text-anchor="middle">0</text>
  <text class="m" x="30" y="298">valor inicial</text>

  <!-- volta 1 -->
  <g class="v1">
    <path class="line" d="M170 112 L170 200"/>
    <text class="plus" x="150" y="166" text-anchor="middle">+</text>
    <path class="line" d="M122 215 L216 215"/>
    <text class="m" x="170" y="248" text-anchor="middle">volta 1</text>
    <rect class="box" x="220" y="170" width="90" height="90" rx="10"/>
    <text class="s" x="265" y="200" text-anchor="middle">soma</text>
    <text class="v" x="265" y="244" text-anchor="middle">1</text>
  </g>

  <!-- volta 2 -->
  <g class="v2">
    <path class="line" d="M360 112 L360 200"/>
    <text class="plus" x="340" y="166" text-anchor="middle">+</text>
    <path class="line" d="M312 215 L406 215"/>
    <text class="m" x="360" y="248" text-anchor="middle">volta 2</text>
    <rect class="box" x="410" y="170" width="90" height="90" rx="10"/>
    <text class="s" x="455" y="200" text-anchor="middle">soma</text>
    <text class="v" x="455" y="244" text-anchor="middle">3</text>
  </g>

  <!-- volta 3 e resultado -->
  <g class="v3">
    <path class="line" d="M550 112 L550 200"/>
    <text class="plus" x="530" y="166" text-anchor="middle">+</text>
    <path class="line" d="M502 215 L596 215"/>
    <text class="m" x="550" y="248" text-anchor="middle">volta 3</text>
    <rect class="res" x="600" y="170" width="90" height="90" rx="10"/>
    <text class="sr" x="645" y="200" text-anchor="middle">soma</text>
    <text class="vr" x="645" y="244" text-anchor="middle">4</text>
    <text class="ok" x="690" y="298" text-anchor="end">resultado</text>
  </g>
</svg>
