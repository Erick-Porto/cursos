<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Inter, system-ui, sans-serif">
  <title>Decomposição de cima para baixo: resumoDoPedido chama subtotal, do E27, calcularFrete, do E26, e faltaParaFreteGratis, da aula 37</title>
  <style>
    .box  { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .top  { fill: #34d399; }
    .code { fill: #e8edf7; font-size: 22px; font-family: 'JetBrains Mono', Consolas, monospace; }
    .h    { fill: #06281c; font-size: 22px; font-weight: 700; font-family: 'JetBrains Mono', Consolas, monospace; }
    .tag  { fill: none; stroke: #60a5fa; stroke-width: 1.5; }
    .tt   { fill: #60a5fa; font-size: 22px; font-weight: 700; }
    .line { stroke: #a78bfa; stroke-width: 2.5; fill: none; }
    .arr  { stroke: #a78bfa; stroke-width: 2.5; fill: none; marker-end: url(#seta); }
  </style>
  <defs>
    <marker id="seta" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#a78bfa"/></marker>
  </defs>
  <rect width="720" height="320" rx="16" fill="#0b1020"/>

  <!-- função de cima -->
  <rect class="top" x="40" y="24" width="380" height="52" rx="10"/>
  <text class="h" x="58" y="58">resumoDoPedido(itens, cep)</text>
  <text class="tt" x="620" y="58" text-anchor="middle">já existe</text>

  <!-- tronco e galhos -->
  <path class="line" d="M74 76 L74 270"/>
  <path class="arr" d="M74 132 L106 132"/>
  <path class="arr" d="M74 201 L106 201"/>
  <path class="arr" d="M74 270 L106 270"/>

  <!-- partes -->
  <rect class="box" x="110" y="108" width="424" height="48" rx="8"/>
  <text class="code" x="126" y="140">subtotal(itens)</text>
  <rect class="tag" x="560" y="112" width="120" height="40" rx="20"/>
  <text class="tt" x="620" y="140" text-anchor="middle">E27</text>

  <rect class="box" x="110" y="177" width="424" height="48" rx="8"/>
  <text class="code" x="126" y="209">calcularFrete(subtotal, cep)</text>
  <rect class="tag" x="560" y="181" width="120" height="40" rx="20"/>
  <text class="tt" x="620" y="209" text-anchor="middle">E26</text>

  <rect class="box" x="110" y="246" width="424" height="48" rx="8"/>
  <text class="code" x="126" y="278">faltaParaFreteGratis(subtotal)</text>
  <rect class="tag" x="560" y="250" width="120" height="40" rx="20"/>
  <text class="tt" x="620" y="278" text-anchor="middle">aula 37</text>
</svg>
