<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Inter, system-ui, sans-serif">
  <title>A classe mãe Pagamento tem descricao e totalAPagar; PagamentoPix, PagamentoCartao e PagamentoBoleto são filhas ligadas a ela por "é um", cada uma com a sua regra de total</title>
  <style>
    .box  { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .head { fill: #34d399; }
    .h    { fill: #06281c; font-size: 22px; font-weight: 700; }
    .t    { fill: #e8edf7; font-size: 22px; }
    .m    { fill: #b4bfd3; font-size: 22px; }
    .lbl  { fill: #a78bfa; font-size: 22px; font-weight: 700; }
    .line { stroke: #a78bfa; stroke-width: 2.5; fill: none; marker-end: url(#seta); }
  </style>
  <defs>
    <marker id="seta" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#a78bfa"/></marker>
  </defs>
  <rect width="720" height="340" rx="16" fill="#0b1020"/>

  <!-- classe mãe -->
  <text class="lbl" x="28" y="76">classe mãe</text>
  <rect class="box" x="180" y="24" width="360" height="92" rx="10"/>
  <path class="head" d="M190 24 H530 A10 10 0 0 1 540 34 V64 H180 V34 A10 10 0 0 1 190 24 Z"/>
  <text class="h" x="360" y="52" text-anchor="middle">Pagamento</text>
  <text class="t" x="360" y="100" text-anchor="middle">descricao, totalAPagar(valor)</text>

  <!-- setas "é um" -->
  <path class="line" d="M130 206 L236 122"/>
  <path class="line" d="M360 206 L360 122"/>
  <path class="line" d="M590 206 L484 122"/>
  <text class="lbl" x="120" y="160" text-anchor="end">é um</text>
  <text class="lbl" x="372" y="170">é um</text>
  <text class="lbl" x="600" y="160">é um</text>

  <!-- filhas -->
  <rect class="box" x="20" y="210" width="220" height="112" rx="10"/>
  <path class="head" d="M30 210 H230 A10 10 0 0 1 240 220 V250 H20 V220 A10 10 0 0 1 30 210 Z"/>
  <text class="h" x="130" y="238" text-anchor="middle">PagamentoPix</text>
  <text class="t" x="130" y="282" text-anchor="middle">5% de desconto</text>

  <rect class="box" x="250" y="210" width="220" height="112" rx="10"/>
  <path class="head" d="M260 210 H460 A10 10 0 0 1 470 220 V250 H250 V220 A10 10 0 0 1 260 210 Z"/>
  <text class="h" x="360" y="238" text-anchor="middle">PagamentoCartao</text>
  <text class="t" x="360" y="282" text-anchor="middle">juros acima de 6x</text>
  <text class="m" x="360" y="310" text-anchor="middle">+ parcelas</text>

  <rect class="box" x="480" y="210" width="220" height="112" rx="10"/>
  <path class="head" d="M490 210 H690 A10 10 0 0 1 700 220 V250 H480 V220 A10 10 0 0 1 490 210 Z"/>
  <text class="h" x="590" y="238" text-anchor="middle">PagamentoBoleto</text>
  <text class="t" x="590" y="282" text-anchor="middle">o próprio valor</text>
  <text class="m" x="590" y="310" text-anchor="middle">+ vencimento</text>
</svg>
