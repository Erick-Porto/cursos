<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Inter, system-ui, sans-serif">
  <title>Ida e volta do catálogo: fs.readFileSync leva o arquivo do disco a um texto e JSON.parse leva o texto a um objeto; JSON.stringify e fs.writeFileSync fazem o caminho inverso</title>
  <style>
    .t    { fill: #e8edf7; font-size: 24px; font-weight: 700; }
    .m    { fill: #b4bfd3; font-size: 22px; }
    .code { fill: #b4bfd3; font-size: 22px; font-family: 'JetBrains Mono', Consolas, monospace; }
    .box  { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .le   { stroke: #34d399; stroke-width: 2.5; fill: none; marker-end: url(#ponta-le); }
    .grava { stroke: #fbbf24; stroke-width: 2.5; fill: none; stroke-dasharray: 8 5; marker-end: url(#ponta-grava); }
    .fle  { fill: #34d399; font-size: 22px; font-weight: 700; font-family: 'JetBrains Mono', Consolas, monospace; }
    .fgr  { fill: #fbbf24; font-size: 22px; font-weight: 700; font-family: 'JetBrains Mono', Consolas, monospace; }
  </style>
  <defs>
    <marker id="ponta-le" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#34d399"/></marker>
    <marker id="ponta-grava" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#fbbf24"/></marker>
  </defs>
  <rect width="720" height="320" rx="16" fill="#0b1020"/>

  <!-- as três formas do catálogo -->
  <rect class="box" x="16" y="110" width="196" height="100" rx="12"/>
  <text class="t" x="114" y="150" text-anchor="middle">Disco</text>
  <text class="code" x="114" y="186" text-anchor="middle">catalogo.json</text>

  <rect class="box" x="262" y="110" width="196" height="100" rx="12"/>
  <text class="t" x="360" y="150" text-anchor="middle">Texto</text>
  <text class="m" x="360" y="186" text-anchor="middle">uma string só</text>

  <rect class="box" x="508" y="110" width="196" height="100" rx="12"/>
  <text class="t" x="606" y="150" text-anchor="middle">Objeto</text>
  <text class="code" x="606" y="186" text-anchor="middle">{ produtos }</text>

  <!-- lendo: em cima -->
  <path class="le" d="M140 108 C 165 58, 295 58, 318 104"/>
  <path class="le" d="M386 108 C 411 58, 541 58, 564 104"/>
  <text class="fle" x="229" y="44" text-anchor="middle">fs.readFileSync</text>
  <text class="fle" x="475" y="44" text-anchor="middle">JSON.parse</text>

  <!-- gravando: embaixo -->
  <path class="grava" d="M580 212 C 555 262, 425 262, 402 216"/>
  <path class="grava" d="M334 212 C 309 262, 179 262, 156 216"/>
  <text class="fgr" x="491" y="292" text-anchor="middle">JSON.stringify</text>
  <text class="fgr" x="245" y="292" text-anchor="middle">fs.writeFileSync</text>
</svg>
