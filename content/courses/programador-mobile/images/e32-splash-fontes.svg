<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Inter, system-ui, sans-serif">
  <title>A splash fica na tela enquanto useFonts carrega a Inter; quando a fonte fica pronta ou falha, hideAsync esconde a splash e o app abre já na letra certa</title>
  <style>
    .tela  { fill: #131c33; stroke: #2a3a5c; stroke-width: 6; }
    .notch { fill: #0b1020; }
    .marca-app { fill: #e8edf7; font-size: 26px; font-weight: 700; }
    .t     { fill: #e8edf7; font-size: 22px; }
    .preco { fill: #34d399; font-size: 22px; font-weight: 700; }
    .div   { stroke: #2a3a5c; stroke-width: 2; }
    .code  { fill: #e8edf7; font-size: 22px; font-family: 'JetBrains Mono', Consolas, monospace; }
    .note  { fill: #b4bfd3; font-size: 22px; }
    .num   { fill: #a78bfa; }
    .numt  { fill: #0b1020; font-size: 22px; font-weight: 700; }
    .linha { stroke: #2a3a5c; stroke-width: 3; }
    .marca { fill: none; stroke: #a78bfa; stroke-width: 3; }
    .app   { animation: abre 8s infinite; }
    .marca { animation: passo 8s infinite; }
    @keyframes abre { 0%, 50% { opacity: 0; } 60%, 90% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes passo {
      0%, 12%   { transform: translateY(-180px); }
      18%, 48%  { transform: translateY(-90px); }
      54%, 92%  { transform: translateY(0); }
      98%, 100% { transform: translateY(-180px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .app, .marca { animation: none; }
    }
  </style>
  <rect width="720" height="360" rx="16" fill="#0b1020"/>

  <!-- a splash: logo sobre a cor primária -->
  <rect x="40" y="24" width="190" height="312" rx="28" fill="#6d28d9" stroke="#2a3a5c" stroke-width="6"/>
  <g transform="translate(99 144) scale(3)" fill="none" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- store (lucide) -->
    <path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/>
    <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
    <path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/>
    <path d="M2 7h20"/>
    <path d="M22 7v3a2 2 0 0 1-2 2a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12a2 2 0 0 1-2-2V7"/>
  </g>

  <!-- o app, já com a Inter, cobre a splash quando ela some -->
  <g class="app">
    <rect class="tela" x="40" y="24" width="190" height="312" rx="28"/>
    <rect class="notch" x="105" y="36" width="60" height="18" rx="9"/>
    <text class="marca-app" x="60" y="100">Lojinha</text>
    <path class="div" d="M 43 122 L 227 122"/>
    <text class="t" x="60" y="160">Fone Bluetooth</text>
    <text class="preco" x="60" y="190">R$ 199,90</text>
    <text class="t" x="60" y="238">Caixa de Som</text>
    <text class="t" x="60" y="266">Portátil</text>
    <text class="preco" x="60" y="296">R$ 249,90</text>
  </g>

  <!-- os três passos -->
  <path class="linha" d="M 290 84 L 290 264"/>
  <circle class="num" cx="290" cy="84" r="16"/>
  <text class="numt" x="290" y="92" text-anchor="middle">1</text>
  <text class="code" x="320" y="80">preventAutoHideAsync()</text>
  <text class="note" x="320" y="110">segura a splash</text>

  <circle class="num" cx="290" cy="174" r="16"/>
  <text class="numt" x="290" y="182" text-anchor="middle">2</text>
  <text class="code" x="320" y="170">useFonts</text>
  <text class="note" x="320" y="200">carregando: return null</text>

  <circle class="num" cx="290" cy="264" r="16"/>
  <text class="numt" x="290" y="272" text-anchor="middle">3</text>
  <text class="code" x="320" y="260">hideAsync()</text>
  <text class="note" x="320" y="290">pronta ou com erro: some</text>

  <rect class="marca" x="266" y="226" width="430" height="80" rx="12"/>
</svg>
