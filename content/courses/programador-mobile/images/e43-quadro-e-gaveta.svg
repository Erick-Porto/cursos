<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="Inter, system-ui, sans-serif">
  <title>As telas leem o GastosProvider, o quadro com lancamentos, adicionar e remover; ao abrir, o quadro tira a lista da gaveta do AsyncStorage com getItem; quando a lista muda, guarda de novo com setItem</title>
  <style>
    .box   { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .prov  { fill: #131c33; stroke: #34d399; stroke-width: 2.5; }
    .gav   { fill: #131c33; stroke: #60a5fa; stroke-width: 2.5; }
    .t     { fill: #e8edf7; font-size: 22px; font-weight: 700; }
    .m     { fill: #b4bfd3; font-size: 22px; }
    .code  { font-size: 22px; font-family: 'JetBrains Mono', Consolas, monospace; }
    .le    { fill: #a78bfa; }
    .claro { fill: #e8edf7; }
    .h     { fill: #34d399; font-size: 22px; font-weight: 700; }
    .hg    { fill: #60a5fa; font-size: 22px; font-weight: 700; }
    .lbl   { fill: #a78bfa; font-size: 22px; font-weight: 700; }
    .fio   { stroke: #2a3a5c; stroke-width: 2.5; }
    .seta  { stroke: #a78bfa; stroke-width: 2.5; fill: none; marker-end: url(#ponta); }
  </style>
  <defs>
    <marker id="ponta" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#a78bfa"/></marker>
  </defs>
  <rect width="720" height="470" rx="16" fill="#0b1020"/>

  <!-- as telas -->
  <rect class="box" x="20" y="20" width="210" height="110" rx="10"/>
  <text class="t" x="36" y="54">Início</text>
  <text class="code le" x="36" y="88">lancamentos</text>

  <rect class="box" x="255" y="20" width="210" height="110" rx="10"/>
  <text class="t" x="271" y="54">Lançamentos</text>
  <text class="code le" x="271" y="88">lancamentos</text>
  <text class="code le" x="271" y="118">remover</text>

  <rect class="box" x="490" y="20" width="210" height="110" rx="10"/>
  <text class="t" x="506" y="54">Novo</text>
  <text class="code le" x="506" y="88">adicionar</text>

  <!-- cada tela pendurada no quadro -->
  <line class="fio" x1="125" y1="130" x2="125" y2="170"/>
  <line class="fio" x1="360" y1="130" x2="360" y2="170"/>
  <line class="fio" x1="595" y1="130" x2="595" y2="170"/>

  <!-- o quadro de avisos, na memória -->
  <rect class="prov" x="20" y="170" width="680" height="116" rx="12"/>
  <text class="h" x="40" y="204">GastosProvider: o quadro, na memória</text>
  <text class="code claro" x="40" y="242">{ lancamentos, adicionar, remover }</text>
  <text class="m" x="40" y="274">cada tela lê com useContext(GastosContext)</text>

  <!-- os dois momentos -->
  <path class="seta" d="M 80 346 L 80 296"/>
  <text class="lbl" x="100" y="328">1. ao abrir: getItem</text>
  <path class="seta" d="M 640 290 L 640 340"/>
  <text class="lbl" x="620" y="328" text-anchor="end">2. mudou: setItem</text>

  <!-- a gaveta do celular -->
  <rect class="gav" x="20" y="350" width="680" height="100" rx="12"/>
  <text class="hg" x="40" y="384">AsyncStorage: a gaveta do celular</text>
  <text x="40" y="424"><tspan class="m">chave </tspan><tspan class="code claro">'gastos.lancamentos'</tspan></text>
  <text class="m" x="680" y="424" text-anchor="end">fica ao fechar o app</text>
</svg>
