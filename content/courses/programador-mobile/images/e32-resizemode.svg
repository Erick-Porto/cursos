<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 292" font-family="Inter, system-ui, sans-serif">
  <title>A mesma foto deitada numa caixa quadrada com cada resizeMode: cover corta as sobras, contain deixa faixas vazias, stretch deforma e center não amplia</title>
  <style>
    .caixa  { fill: #131c33; }
    .borda  { fill: none; stroke: #b4bfd3; stroke-width: 2; }
    .code   { fill: #e8edf7; font-size: 22px; font-family: 'JetBrains Mono', Consolas, monospace; }
    .note   { fill: #b4bfd3; font-size: 22px; }
  </style>
  <defs>
    <!-- a foto: 200 por 100, deitada -->
    <g id="foto">
      <rect width="200" height="100" fill="#60a5fa"/>
      <path d="M 0 74 L 40 34 L 80 74 Z M 120 74 L 160 34 L 200 74 Z" fill="#a78bfa"/>
      <rect y="72" width="200" height="28" fill="#34d399"/>
      <circle cx="100" cy="44" r="20" fill="#fbbf24"/>
    </g>
    <clipPath id="c1"><rect x="40" y="36" width="130" height="130" rx="8"/></clipPath>
    <clipPath id="c2"><rect x="210" y="36" width="130" height="130" rx="8"/></clipPath>
    <clipPath id="c3"><rect x="380" y="36" width="130" height="130" rx="8"/></clipPath>
    <clipPath id="c4"><rect x="550" y="36" width="130" height="130" rx="8"/></clipPath>
  </defs>
  <rect width="720" height="292" rx="16" fill="#0b1020"/>
  <g transform="translate(0 11)">

  <!-- cover: preenche e corta -->
  <rect class="caixa" x="40" y="36" width="130" height="130" rx="8"/>
  <g clip-path="url(#c1)"><use href="#foto" transform="translate(-25 36) scale(1.3)"/></g>
  <rect class="borda" x="40" y="36" width="130" height="130" rx="8"/>
  <text class="code" x="105" y="204" text-anchor="middle">cover</text>
  <text class="note" x="105" y="236" text-anchor="middle">corta</text>

  <!-- contain: foto inteira, sobra faixa -->
  <rect class="caixa" x="210" y="36" width="130" height="130" rx="8"/>
  <g clip-path="url(#c2)"><use href="#foto" transform="translate(210 68.5) scale(0.65)"/></g>
  <rect class="borda" x="210" y="36" width="130" height="130" rx="8"/>
  <text class="code" x="275" y="204" text-anchor="middle">contain</text>
  <text class="note" x="275" y="236" text-anchor="middle">sobra faixa</text>

  <!-- stretch: estica e deforma -->
  <rect class="caixa" x="380" y="36" width="130" height="130" rx="8"/>
  <g clip-path="url(#c3)"><use href="#foto" transform="translate(380 36) scale(0.65 1.3)"/></g>
  <rect class="borda" x="380" y="36" width="130" height="130" rx="8"/>
  <text class="code" x="445" y="204" text-anchor="middle">stretch</text>
  <text class="note" x="445" y="236" text-anchor="middle">deforma</text>

  <!-- center: centraliza sem ampliar -->
  <rect class="caixa" x="550" y="36" width="130" height="130" rx="8"/>
  <g clip-path="url(#c4)"><use href="#foto" transform="translate(575 88.5) scale(0.4)"/></g>
  <rect class="borda" x="550" y="36" width="130" height="130" rx="8"/>
  <text class="code" x="615" y="204" text-anchor="middle">center</text>
  <text class="note" x="615" y="236" text-anchor="middle">sem ampliar</text>
  </g>
</svg>
