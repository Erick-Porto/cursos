<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Inter, system-ui, sans-serif">
  <title>No Expo Go, o JavaScript e os dados vêm do computador; no APK de preview, o JavaScript está dentro do celular e só os dados vêm do computador</title>
  <style>
    .panel { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .dev   { fill: #0b1020; stroke: #2a3a5c; stroke-width: 1.5; }
    .h     { fill: #e8edf7; font-size: 24px; font-weight: 700; }
    .t     { fill: #e8edf7; font-size: 22px; }
    .chip  { fill: #131c33; stroke: #a78bfa; stroke-width: 2; }
    .in    { fill: #34d399; }
    .inT   { fill: #06281c; font-size: 22px; font-weight: 700; }
    .line  { stroke: #a78bfa; stroke-width: 2.5; fill: none; marker-end: url(#seta); }
    .ico   { fill: none; stroke: #b4bfd3; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .no    { fill: #f87171; font-size: 22px; font-weight: 700; }
    .ok    { fill: #34d399; font-size: 22px; font-weight: 700; }
  </style>
  <defs>
    <marker id="seta" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#a78bfa"/></marker>
  </defs>
  <rect width="720" height="340" rx="16" fill="#0b1020"/>

  <!-- Expo Go -->
  <rect class="panel" x="16" y="16" width="336" height="308" rx="12"/>
  <text class="h" x="184" y="52" text-anchor="middle">Expo Go</text>
  <rect class="dev" x="40" y="70" width="288" height="52" rx="10"/>
  <g class="ico" transform="translate(54 79) scale(1.4)"><path d="M20 16V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9m16 0H4m16 0 1.28 2.55a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45L4 16"/></g>
  <text class="t" x="100" y="104">computador</text>
  <path class="line" d="M 110 124 L 110 210"/>
  <path class="line" d="M 258 124 L 258 210"/>
  <rect class="chip" x="42" y="149" width="136" height="38" rx="19"/>
  <text class="t" x="110" y="176" text-anchor="middle">JavaScript</text>
  <rect class="chip" x="208" y="149" width="100" height="38" rx="19"/>
  <text class="t" x="258" y="176" text-anchor="middle">dados</text>
  <rect class="dev" x="40" y="214" width="288" height="52" rx="10"/>
  <g class="ico" transform="translate(54 223) scale(1.4)"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></g>
  <text class="t" x="100" y="248">celular</text>
  <text class="no" x="184" y="303" text-anchor="middle">notebook fechado: não abre</text>

  <!-- APK de preview -->
  <rect class="panel" x="368" y="16" width="336" height="308" rx="12"/>
  <text class="h" x="536" y="52" text-anchor="middle">APK de preview</text>
  <rect class="dev" x="392" y="70" width="288" height="52" rx="10"/>
  <g class="ico" transform="translate(406 79) scale(1.4)"><path d="M20 16V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9m16 0H4m16 0 1.28 2.55a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45L4 16"/></g>
  <text class="t" x="452" y="104">computador</text>
  <path class="line" d="M 610 124 L 610 210"/>
  <rect class="chip" x="560" y="149" width="100" height="38" rx="19"/>
  <text class="t" x="610" y="176" text-anchor="middle">dados</text>
  <rect class="dev" x="392" y="214" width="288" height="52" rx="10"/>
  <g class="ico" transform="translate(402 223) scale(1.4)"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></g>
  <text class="t" x="444" y="248">celular</text>
  <rect class="in" x="532" y="222" width="140" height="36" rx="18"/>
  <text class="inT" x="602" y="248" text-anchor="middle">JavaScript</text>
  <text class="ok" x="536" y="303" text-anchor="middle">notebook fechado: abre</text>
</svg>
