<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Inter, system-ui, sans-serif">
  <title>Herança e composição no projeto: a TarefaRecorrente é uma Tarefa, com extends; a ListaDeTarefas guarda as tarefas em this.tarefas; a lista não é uma tarefa</title>
  <style>
    .box  { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .head { fill: #34d399; }
    .slot { fill: #0b1020; stroke: #a78bfa; stroke-width: 1.5; }
    .h    { fill: #06281c; font-size: 22px; font-weight: 700; }
    .t    { fill: #e8edf7; font-size: 22px; }
    .ttl  { fill: #e8edf7; font-size: 24px; font-weight: 700; }
    .lbl  { fill: #a78bfa; font-size: 22px; font-weight: 700; }
    .code { fill: #b4bfd3; font-size: 22px; font-family: 'JetBrains Mono', Consolas, monospace; }
    .no   { fill: #f87171; font-size: 22px; font-weight: 700; }
    .x    { stroke: #f87171; stroke-width: 3.5; stroke-linecap: round; }
    .line { stroke: #a78bfa; stroke-width: 2.5; fill: none; marker-end: url(#seta); }
  </style>
  <defs>
    <marker id="seta" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#a78bfa"/></marker>
  </defs>
  <rect width="720" height="360" rx="16" fill="#0b1020"/>

  <!-- herança: a filha aponta para a mãe -->
  <text class="ttl" x="30" y="44">Herança</text>
  <rect class="head" x="30" y="64" width="250" height="48" rx="10"/>
  <text class="h" x="155" y="95" text-anchor="middle">Tarefa</text>
  <path class="line" d="M100 226 L100 118"/>
  <text class="lbl" x="116" y="164">é uma</text>
  <text class="code" x="116" y="196">extends</text>
  <rect class="head" x="30" y="230" width="250" height="48" rx="10"/>
  <text class="h" x="155" y="261" text-anchor="middle">TarefaRecorrente</text>

  <!-- composição: a lista guarda as tarefas -->
  <text class="ttl" x="320" y="44">Composição</text>
  <rect class="box" x="320" y="64" width="370" height="236" rx="10"/>
  <path class="head" d="M330 64 H680 A10 10 0 0 1 690 74 V104 H320 V74 A10 10 0 0 1 330 64 Z"/>
  <text class="h" x="505" y="92" text-anchor="middle">ListaDeTarefas</text>
  <text class="t" x="340" y="136"><tspan class="lbl">guarda</tspan> em <tspan class="code">this.tarefas</tspan></text>
  <rect class="slot" x="340" y="150" width="330" height="40" rx="8"/>
  <text class="t" x="356" y="178"><tspan class="lbl">1</tspan>  Pagar a conta de luz</text>
  <rect class="slot" x="340" y="198" width="330" height="40" rx="8"/>
  <text class="t" x="356" y="226"><tspan class="lbl">2</tspan>  Regar as plantas</text>
  <rect class="slot" x="340" y="246" width="330" height="40" rx="8"/>
  <text class="t" x="356" y="274"><tspan class="lbl">3</tspan>  Comprar ração do gato</text>

  <!-- relação falsa -->
  <path class="x" d="M34 318 L50 334 M50 318 L34 334"/>
  <text class="no" x="64" y="334">a lista não é uma tarefa: ela guarda tarefas</text>
</svg>
