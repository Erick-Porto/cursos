<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" font-family="Inter, system-ui, sans-serif">
  <title>Herança e composição: PagamentoPix é um Pagamento; o Pedido tem itens, tem uma entrega e tem um pagamento; o pedido não é um pagamento</title>
  <style>
    .box  { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .head { fill: #34d399; }
    .slot { fill: #0b1020; stroke: #a78bfa; stroke-width: 1.5; }
    .h    { fill: #06281c; font-size: 22px; font-weight: 700; }
    .t    { fill: #e8edf7; font-size: 22px; }
    .ttl  { fill: #e8edf7; font-size: 24px; font-weight: 700; }
    .lbl  { fill: #a78bfa; font-size: 22px; font-weight: 700; }
    .code { fill: #b4bfd3; font-size: 22px; font-family: 'JetBrains Mono', Consolas, monospace; }
    .no   { fill: #f87171; font-size: 22px; font-weight: 700; }
    .x    { stroke: #f87171; stroke-width: 3.5; stroke-linecap: round; }
    .line { stroke: #a78bfa; stroke-width: 2.5; fill: none; marker-end: url(#seta); }
  </style>
  <defs>
    <marker id="seta" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#a78bfa"/></marker>
  </defs>
  <rect width="720" height="350" rx="16" fill="#0b1020"/>

  <!-- herança -->
  <text class="ttl" x="40" y="44">Herança</text>
  <rect class="head" x="40" y="64" width="230" height="48" rx="10"/>
  <text class="h" x="155" y="95" text-anchor="middle">Pagamento</text>
  <path class="line" d="M110 226 L110 118"/>
  <text class="lbl" x="126" y="164">é um</text>
  <text class="code" x="126" y="196">extends</text>
  <rect class="head" x="40" y="230" width="230" height="48" rx="10"/>
  <text class="h" x="155" y="261" text-anchor="middle">PagamentoPix</text>

  <!-- composição -->
  <text class="ttl" x="320" y="44">Composição</text>
  <rect class="box" x="320" y="64" width="380" height="226" rx="10"/>
  <path class="head" d="M330 64 H690 A10 10 0 0 1 700 74 V104 H320 V74 A10 10 0 0 1 330 64 Z"/>
  <text class="h" x="510" y="92" text-anchor="middle">Pedido</text>
  <rect class="slot" x="340" y="118" width="340" height="44" rx="8"/>
  <text class="t" x="358" y="148"><tspan class="lbl">tem</tspan> itens</text>
  <rect class="slot" x="340" y="172" width="340" height="44" rx="8"/>
  <text class="t" x="358" y="202"><tspan class="lbl">tem</tspan> uma entrega</text>
  <rect class="slot" x="340" y="226" width="340" height="44" rx="8"/>
  <text class="t" x="358" y="256"><tspan class="lbl">tem</tspan> um pagamento</text>

  <!-- relação falsa -->
  <path class="x" d="M44 312 L60 328 M60 312 L44 328"/>
  <text class="no" x="74" y="328">o pedido não é um pagamento: não herde</text>
</svg>
