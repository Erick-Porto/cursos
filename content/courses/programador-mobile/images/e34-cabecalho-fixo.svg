<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Inter, system-ui, sans-serif">
  <title>Cabeçalho fixo na SectionList: Áudio fica preso no topo enquanto os itens rolam por baixo, até Casa chegar, empurrá-lo e ocupar o lugar</title>
  <style>
    .t    { fill: #e8edf7; font-size: 22px; }
    .b    { fill: #e8edf7; font-size: 22px; font-weight: 700; }
    .m    { fill: #b4bfd3; font-size: 22px; }
    .card { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .hd   { fill: #34d399; stroke: #0b1020; stroke-width: 2; }
    .ht   { fill: #06281c; font-size: 22px; font-weight: 700; }
    .lead { fill: none; stroke: #a78bfa; stroke-width: 2; }
    .anim { animation-duration: 8s; animation-iteration-count: infinite; animation-timing-function: linear; }
    .rola  { animation-name: rola; }
    .casa  { animation-name: casa; }
    .audio { animation-name: audio; }
    @keyframes rola {
      0%        { transform: translateY(344px); opacity: 0; }
      4%        { opacity: 1; }
      10%       { transform: translateY(344px); }
      70%       { transform: translateY(0); }
      92%       { opacity: 1; }
      97%, 100% { transform: translateY(0); opacity: 0; }
    }
    @keyframes casa {
      0%        { transform: translateY(272px); opacity: 0; }
      4%        { opacity: 1; }
      10%       { transform: translateY(272px); }
      57.4%     { transform: translateY(0); }
      92%       { opacity: 1; }
      97%, 100% { transform: translateY(0); opacity: 0; }
    }
    @keyframes audio {
      0%        { transform: translateY(48px); opacity: 0; }
      4%        { opacity: 1; }
      49.1%     { transform: translateY(48px); }
      57.4%     { transform: translateY(0); }
      92%       { opacity: 1; }
      97%, 100% { transform: translateY(0); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .anim { animation: none; } }
  </style>
  <defs>
    <clipPath id="tela"><rect x="40" y="20" width="300" height="320" rx="22"/></clipPath>
  </defs>
  <rect width="720" height="360" rx="16" fill="#0b1020"/>

  <g clip-path="url(#tela)">
    <!-- os itens rolam -->
    <g class="anim rola">
      <rect class="card" x="52" y="-268" width="276" height="64" rx="8"/><text class="t" x="66" y="-229">Fone Bluetooth</text>
      <rect class="card" x="52" y="-196" width="276" height="64" rx="8"/><text class="t" x="66" y="-157">Caixa de Som Portátil</text>
      <rect class="card" x="52" y="-124" width="276" height="64" rx="8"/><text class="t" x="66" y="-85">Microfone USB</text>
      <rect class="card" x="52" y="4" width="276" height="64" rx="8"/><text class="t" x="66" y="43">Luminária de Mesa</text>
      <rect class="card" x="52" y="76" width="276" height="64" rx="8"/><text class="t" x="66" y="115">Garrafa Térmica</text>
      <rect class="card" x="52" y="148" width="276" height="64" rx="8"/><text class="t" x="66" y="187">Jogo de Panelas</text>
      <rect class="hd" x="40" y="220" width="300" height="48"/><text class="ht" x="56" y="252">Esporte (3)</text>
      <rect class="card" x="52" y="276" width="276" height="64" rx="8"/><text class="t" x="66" y="315">Tênis de Corrida</text>
    </g>
    <!-- Casa: rola até o topo e fica -->
    <g class="anim casa">
      <rect class="hd" x="40" y="20" width="300" height="48"/><text class="ht" x="56" y="52">Casa (3)</text>
    </g>
    <!-- Áudio: preso no topo até ser empurrado -->
    <g class="anim audio">
      <rect class="hd" x="40" y="-28" width="300" height="48"/><text class="ht" x="56" y="4">Áudio (3)</text>
    </g>
  </g>
  <rect x="40" y="20" width="300" height="320" rx="22" fill="none" stroke="#b4bfd3" stroke-width="2.5"/>

  <!-- rótulos -->
  <path class="lead" d="M 340 44 L 368 44"/>
  <text class="b" x="378" y="50">título preso no topo</text>
  <text class="m" x="378" y="80">tem fundo: os itens</text>
  <text class="m" x="378" y="108">passam por baixo dele</text>

  <path class="lead" d="M 340 244 L 368 244"/>
  <text class="b" x="378" y="236">o próximo título</text>
  <text class="m" x="378" y="266">sobe, empurra o atual</text>
  <text class="m" x="378" y="294">e toma o lugar</text>
</svg>
