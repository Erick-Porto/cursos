<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Inter, system-ui, sans-serif">
  <title>O mesmo celular com 393 de largura em pé mostra 2 colunas; deitado, com 852, passa do breakpoint de 600 e mostra 3 colunas</title>
  <style>
    .phone { fill: #131c33; stroke: #2a3a5c; stroke-width: 2; }
    .tela  { fill: #0b1020; }
    .card  { fill: #131c33; stroke: #34d399; stroke-width: 2; }
    .t     { fill: #e8edf7; font-size: 22px; font-weight: 700; }
    .m     { fill: #b4bfd3; font-size: 22px; }
    .code  { fill: #fbbf24; font-size: 22px; font-weight: 700; font-family: 'JetBrains Mono', Consolas, monospace; }
    .line  { stroke: #a78bfa; stroke-width: 3; fill: none; marker-end: url(#seta); }
    .gira  { transform-box: fill-box; transform-origin: center; animation: gira 8s ease-in-out infinite; }
    .grade { animation: grade 8s ease-out infinite; }
    .cap   { animation: cap 8s ease-out infinite; }
    @keyframes gira {
      0%, 8%   { opacity: 0; transform: rotate(-90deg) scale(0.75); }
      12%      { opacity: 1; transform: rotate(-90deg) scale(0.75); }
      28%, 92% { opacity: 1; transform: rotate(0deg) scale(1); }
      100%     { opacity: 0; transform: rotate(0deg) scale(1); }
    }
    @keyframes grade {
      0%, 34%  { opacity: 0; }
      44%, 92% { opacity: 1; }
      100%     { opacity: 0; }
    }
    @keyframes cap {
      0%, 44%  { opacity: 0; }
      52%, 92% { opacity: 1; }
      100%     { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .gira, .grade, .cap { animation: none; }
    }
  </style>
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
  </defs>
  <rect width="720" height="380" rx="16" fill="#0b1020"/>

  <text class="code" x="360" y="48" text-anchor="middle">colunas = width &gt;= 600 ? 3 : 2</text>

  <!-- em pé: 393 de largura, 2 colunas -->
  <rect class="phone" x="64" y="80" width="160" height="240" rx="20"/>
  <rect class="tela" x="72" y="88" width="144" height="224" rx="14"/>
  <path class="card" d="M80 98h60v56h-60z M148 98h60v56h-60z M80 162h60v56h-60z M148 162h60v56h-60z M80 226h60v56h-60z M148 226h60v56h-60z"/>
  <text class="t" x="144" y="358" text-anchor="middle">393 em pé: 2 colunas</text>

  <!-- girar -->
  <text class="m" x="280" y="168" text-anchor="middle">girar</text>
  <path class="line" d="M 240 222 Q 280 180 322 218"/>

  <!-- deitado: 852 de largura, 3 colunas -->
  <g class="gira">
    <rect class="phone" x="336" y="128" width="328" height="160" rx="20"/>
    <rect class="tela" x="344" y="136" width="312" height="144" rx="14"/>
  </g>
  <path class="card grade" d="M352 146h93v56h-93z M453 146h94v56h-94z M555 146h93v56h-93z M352 214h93v56h-93z M453 214h94v56h-94z M555 214h93v56h-93z"/>
  <text class="t cap" x="500" y="358" text-anchor="middle">852 deitado: 3 colunas</text>
</svg>
