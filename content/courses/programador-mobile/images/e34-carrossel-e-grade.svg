<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Inter, system-ui, sans-serif">
  <title>Tela Início: o carrossel horizontal mora no ListHeaderComponent da grade de 2 colunas, e a lista inteira rola na vertical</title>
  <style>
    .b    { fill: #e8edf7; font-size: 22px; font-weight: 700; }
    .m    { fill: #b4bfd3; font-size: 22px; }
    .code { font-size: 22px; font-weight: 700; font-family: 'JetBrains Mono', Consolas, monospace; }
    .card { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .img  { fill: #2a3a5c; }
    .head { fill: none; stroke: #a78bfa; stroke-width: 2.5; stroke-dasharray: 8 5; }
    .lead { fill: none; stroke-width: 2; }
  </style>
  <defs>
    <clipPath id="tela"><rect x="70" y="20" width="260" height="320" rx="22"/></clipPath>
    <clipPath id="faixa"><rect x="82" y="30" width="236" height="176"/></clipPath>
  </defs>
  <rect width="720" height="360" rx="16" fill="#0b1020"/>

  <!-- rolagem vertical da lista inteira -->
  <path d="M 44 66 L 44 294" stroke="#34d399" stroke-width="3"/>
  <path d="M 44 52 L 36 68 L 52 68 Z M 44 308 L 36 292 L 52 292 Z" fill="#34d399"/>

  <g clip-path="url(#tela)">
    <!-- ListHeaderComponent: título, carrossel e título da grade -->
    <rect class="head" x="80" y="30" width="240" height="176" rx="10"/>
    <text class="b" x="94" y="60">Destaques</text>
    <g clip-path="url(#faixa)">
      <rect class="card" x="94" y="72" width="92" height="74" rx="8"/>
      <rect class="img" x="102" y="80" width="76" height="40" rx="4"/>
      <rect class="card" x="198" y="72" width="92" height="74" rx="8"/>
      <rect class="img" x="206" y="80" width="76" height="40" rx="4"/>
      <rect class="card" x="302" y="72" width="92" height="74" rx="8"/>
      <rect class="img" x="310" y="80" width="76" height="40" rx="4"/>
    </g>
    <path d="M 128 166 L 284 166" stroke="#60a5fa" stroke-width="3"/>
    <path d="M 116 166 L 130 158 L 130 174 Z M 296 166 L 282 158 L 282 174 Z" fill="#60a5fa"/>
    <text class="b" x="94" y="196">Todos os produtos</text>

    <!-- grade de 2 colunas -->
    <g>
      <rect class="card" x="86" y="216" width="112" height="88" rx="8"/>
      <rect class="img" x="94" y="224" width="96" height="52" rx="4"/>
      <rect class="card" x="206" y="216" width="112" height="88" rx="8"/>
      <rect class="img" x="214" y="224" width="96" height="52" rx="4"/>
      <rect class="card" x="86" y="312" width="112" height="88" rx="8"/>
      <rect class="img" x="94" y="320" width="96" height="52" rx="4"/>
      <rect class="card" x="206" y="312" width="112" height="88" rx="8"/>
      <rect class="img" x="214" y="320" width="96" height="52" rx="4"/>
    </g>
  </g>
  <rect x="70" y="20" width="260" height="320" rx="22" fill="none" stroke="#b4bfd3" stroke-width="2.5"/>

  <!-- rótulos -->
  <path class="lead" d="M 320 50 L 356 50" stroke="#a78bfa"/>
  <text class="code" x="364" y="56" fill="#a78bfa">ListHeaderComponent</text>
  <text class="m" x="364" y="84">rola junto com a grade</text>

  <path class="lead" d="M 318 112 L 356 144" stroke="#60a5fa"/>
  <text class="code" x="364" y="152" fill="#60a5fa">FlatList horizontal</text>
  <text class="m" x="364" y="180">o carrossel: rola para o lado</text>

  <path class="lead" d="M 318 260 L 356 252" stroke="#34d399"/>
  <text class="code" x="364" y="258" fill="#34d399">FlatList numColumns={2}</text>
  <text class="m" x="364" y="286">a grade: a tela toda rola</text>
  <text class="m" x="364" y="314">para baixo, cabeçalho junto</text>
</svg>
