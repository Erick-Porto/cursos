<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Inter, system-ui, sans-serif">
  <title>O caminho '../regras/conta.js' parte da pasta scripts, onde está o racha.js, sobe para src com os dois pontos e entra na pasta regras até o conta.js</title>
  <style>
    .fora  { fill: none; stroke: #2a3a5c; stroke-width: 2; }
    .pasta { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .rot   { fill: #b4bfd3; font-size: 22px; font-family: 'JetBrains Mono', Consolas, monospace; }
    .arq   { fill: #e8edf7; font-size: 24px; font-weight: 700; font-family: 'JetBrains Mono', Consolas, monospace; }
    .imp   { fill: #0b1020; stroke: #a78bfa; stroke-width: 2.5; }
    .exp   { fill: #0b1020; stroke: #34d399; stroke-width: 2.5; }
    .ti    { fill: #a78bfa; font-size: 22px; }
    .te    { fill: #34d399; font-size: 22px; }
    .seta  { stroke: #fbbf24; stroke-width: 3; fill: none; stroke-linejoin: round; }
    .passo { fill: #fbbf24; font-size: 22px; font-weight: 700; }
    .mono  { font-family: 'JetBrains Mono', Consolas, monospace; }
  </style>
  <rect width="720" height="340" rx="16" fill="#0b1020"/>

  <rect class="fora" x="20" y="20" width="680" height="300" rx="12"/>
  <text class="rot" x="40" y="56">src/</text>

  <rect class="pasta" x="44" y="150" width="300" height="152" rx="10"/>
  <text class="rot" x="64" y="184">scripts/</text>
  <rect class="imp" x="74" y="202" width="240" height="82" rx="8"/>
  <text class="arq" x="94" y="236">racha.js</text>
  <text class="ti" x="94" y="268">faz o import</text>

  <rect class="pasta" x="376" y="150" width="300" height="152" rx="10"/>
  <text class="rot" x="396" y="184">regras/</text>
  <rect class="exp" x="406" y="202" width="240" height="82" rx="8"/>
  <text class="arq" x="426" y="236">conta.js</text>
  <text class="te" x="426" y="268">tem o export</text>

  <path class="seta" d="M 250 202 L 250 104 L 590 104 L 590 190"/>
  <path d="M 578 186 L 602 186 L 590 202 Z" fill="#fbbf24"/>

  <text class="passo mono" x="226" y="88">'..</text>
  <text class="passo mono" x="408" y="88">/regras/conta.js'</text>
  <text class="passo" x="264" y="136">sobe</text>
  <text class="passo" x="606" y="136">entra</text>
</svg>
