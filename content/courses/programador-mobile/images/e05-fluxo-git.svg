<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Inter, system-ui, sans-serif">
  <title>Caminho de uma mudança: git add leva da pasta do projeto à área de preparação, git commit grava a foto no álbum do computador e git push envia ao GitHub, na nuvem</title>
  <style>
    .box  { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .gh   { fill: #131c33; stroke: #60a5fa; stroke-width: 2.5; }
    .pc   { fill: none; stroke: #b4bfd3; stroke-width: 1.5; stroke-dasharray: 7 6; }
    .t    { fill: #e8edf7; font-size: 22px; font-weight: 700; }
    .m    { fill: #b4bfd3; font-size: 22px; }
    .cmd  { fill: #a78bfa; font-size: 22px; font-weight: 700; font-family: 'JetBrains Mono', Consolas, monospace; }
    .git  { fill: #34d399; font-size: 22px; font-weight: 700; font-family: 'JetBrains Mono', Consolas, monospace; }
    .line { stroke: #a78bfa; stroke-width: 3; fill: none; marker-end: url(#seta); }
  </style>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" markerWidth="5" markerHeight="5" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
  </defs>
  <rect width="720" height="360" rx="16" fill="#0b1020"/>

  <!-- seu computador -->
  <rect x="16" y="16" width="688" height="214" rx="14" class="pc"/>
  <text x="36" y="48" class="m">seu computador</text>

  <rect x="36" y="118" width="180" height="84" rx="12" class="box"/>
  <text x="126" y="152" text-anchor="middle" class="t">pasta do</text>
  <text x="126" y="182" text-anchor="middle" class="t">projeto</text>

  <rect x="270" y="118" width="180" height="84" rx="12" class="box"/>
  <text x="360" y="152" text-anchor="middle" class="t">área de</text>
  <text x="360" y="182" text-anchor="middle" class="t">preparação</text>

  <rect x="504" y="118" width="180" height="84" rx="12" class="box"/>
  <text x="594" y="152" text-anchor="middle" class="t">álbum</text>
  <text x="594" y="182" text-anchor="middle" class="git">.git</text>

  <!-- add e commit -->
  <path d="M 186 116 C 196 78, 290 78, 300 110" class="line"/>
  <text x="243" y="74" text-anchor="middle" class="cmd">git add</text>
  <path d="M 420 116 C 430 78, 524 78, 534 110" class="line"/>
  <text x="477" y="74" text-anchor="middle" class="cmd">git commit</text>

  <!-- GitHub, na nuvem -->
  <text x="480" y="318" text-anchor="end" class="m">na nuvem</text>
  <rect x="504" y="278" width="180" height="64" rx="12" class="gh"/>
  <text x="594" y="318" text-anchor="middle" class="t">GitHub</text>

  <!-- push -->
  <path d="M 594 204 L 594 270" class="line"/>
  <text x="580" y="256" text-anchor="end" class="cmd">git push</text>
</svg>
