<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Inter, system-ui, sans-serif">
  <title>A tela do Livro de Receitas em peças: o App encaixa o Cabecalho, três CartaoReceita, cada um com uma Etiqueta, e o Rodape</title>
  <style>
    .app   { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .kit   { fill: #0b1020; stroke: #60a5fa; stroke-width: 2; }
    .seu   { fill: #0b1020; stroke: #34d399; stroke-width: 2.5; stroke-dasharray: 8 6; }
    .foto  { fill: #2a3a5c; }
    .pilula { fill: #131c33; stroke: #60a5fa; stroke-width: 2; }
    .mono  { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 22px; }
    .napp  { fill: #a78bfa; font-weight: 700; }
    .nkit  { fill: #60a5fa; }
    .nseu  { fill: #34d399; font-weight: 700; }
    .t     { fill: #e8edf7; font-size: 22px; font-weight: 700; }
    .leg   { fill: #b4bfd3; font-size: 22px; }
  </style>
  <rect width="720" height="420" rx="16" fill="#0b1020"/>

  <!-- App: a tela inteira -->
  <rect class="app" x="20" y="20" width="680" height="346" rx="12"/>
  <text class="mono napp" x="40" y="52">App</text>

  <!-- Cabecalho (kit) -->
  <rect class="kit" x="40" y="66" width="640" height="56" rx="8"/>
  <text class="t" x="60" y="102">Livro de Receitas</text>
  <text class="mono nkit" x="660" y="102" text-anchor="end">Cabecalho</text>

  <!-- três CartaoReceita (seu), cada um com uma Etiqueta (kit) -->
  <rect class="seu" x="40" y="136" width="200" height="168" rx="10"/>
  <rect class="foto" x="54" y="150" width="172" height="44" rx="6"/>
  <text class="mono nseu" x="54" y="228">CartaoReceita</text>
  <rect class="pilula" x="54" y="246" width="132" height="40" rx="20"/>
  <text class="mono nkit" x="120" y="273" text-anchor="middle">Etiqueta</text>

  <rect class="seu" x="260" y="136" width="200" height="168" rx="10"/>
  <rect class="foto" x="274" y="150" width="172" height="44" rx="6"/>
  <text class="mono nseu" x="274" y="228">CartaoReceita</text>
  <rect class="pilula" x="274" y="246" width="132" height="40" rx="20"/>
  <text class="mono nkit" x="340" y="273" text-anchor="middle">Etiqueta</text>

  <rect class="seu" x="480" y="136" width="200" height="168" rx="10"/>
  <rect class="foto" x="494" y="150" width="172" height="44" rx="6"/>
  <text class="mono nseu" x="494" y="228">CartaoReceita</text>
  <rect class="pilula" x="494" y="246" width="132" height="40" rx="20"/>
  <text class="mono nkit" x="560" y="273" text-anchor="middle">Etiqueta</text>

  <!-- Rodape (kit) -->
  <rect class="kit" x="40" y="318" width="640" height="36" rx="8"/>
  <rect class="foto" x="60" y="330" width="220" height="12" rx="6"/>
  <text class="mono nkit" x="660" y="344" text-anchor="end">Rodape</text>

  <!-- legenda: contorno cheio = kit; tracejado = você -->
  <rect class="kit" x="40" y="384" width="30" height="22" rx="4"/>
  <text class="leg" x="80" y="403">peça do kit</text>
  <rect class="seu" x="300" y="384" width="30" height="22" rx="4"/>
  <text class="leg" x="340" y="403">peça que você escreve</text>
</svg>
