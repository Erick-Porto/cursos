<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Inter, system-ui, sans-serif">
  <title>Uma execução do workflow: o git push liga um runner Linux novo, que roda npm ci e o verificar, com eslint e jest em sequência; todos passaram dá o visto verde, algum falhou dá o X vermelho</title>
  <style>
    .box  { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .run  { fill: none; stroke: #60a5fa; stroke-width: 2; stroke-dasharray: 8 6; }
    .okb  { fill: #131c33; stroke: #34d399; stroke-width: 2.5; }
    .nob  { fill: none; stroke: #f87171; stroke-width: 2; stroke-dasharray: 8 5; }
    .m    { fill: #b4bfd3; font-size: 22px; }
    .info { fill: #60a5fa; font-size: 22px; font-weight: 700; }
    .ok   { fill: #34d399; font-size: 22px; font-weight: 700; }
    .no   { fill: #f87171; font-size: 22px; font-weight: 700; }
    .code { fill: #e8edf7; font-size: 22px; font-family: 'JetBrains Mono', Consolas, monospace; }
    .cmd  { fill: #e8edf7; font-size: 22px; font-weight: 700; font-family: 'JetBrains Mono', Consolas, monospace; }
    .line { stroke: #a78bfa; stroke-width: 3; fill: none; marker-end: url(#seta); }
    .lok  { stroke: #34d399; stroke-width: 3; fill: none; marker-end: url(#seta-ok); }
    .chk  { stroke: #06281c; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .c1 { animation: c1 8s infinite; }
    .c2 { animation: c2 8s infinite; }
    .c3 { animation: c3 8s infinite; }
    @keyframes c1 { 0%, 6%  { opacity: 0; transform: translateX(-10px); } 14%, 94% { opacity: 1; transform: translateX(0); } 100% { opacity: 0; } }
    @keyframes c2 { 0%, 26% { opacity: 0; transform: translateX(-10px); } 34%, 94% { opacity: 1; transform: translateX(0); } 100% { opacity: 0; } }
    @keyframes c3 { 0%, 46% { opacity: 0; transform: translateX(-10px); } 54%, 94% { opacity: 1; transform: translateX(0); } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .c1, .c2, .c3 { animation: none; }
    }
  </style>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" markerWidth="5" markerHeight="5" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
    <marker id="seta-ok" viewBox="0 0 10 10" markerWidth="5" markerHeight="5" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
  </defs>
  <rect width="720" height="340" rx="16" fill="#0b1020"/>

  <!-- o evento -->
  <rect x="24" y="132" width="140" height="96" rx="12" class="box"/>
  <text x="94" y="172" text-anchor="middle" class="cmd">git push</text>
  <text x="94" y="206" text-anchor="middle" class="m">ou PR</text>
  <path d="M 168 180 L 192 180" class="line"/>

  <!-- o runner e os passos -->
  <rect x="200" y="20" width="270" height="300" rx="14" class="run"/>
  <text x="218" y="56" class="info">runner Linux novo</text>
  <rect x="216" y="80" width="238" height="60" rx="10" class="box"/>
  <text x="232" y="118" class="code">npm ci</text>
  <rect x="216" y="160" width="238" height="60" rx="10" class="box"/>
  <text x="232" y="198" class="code">eslint .</text>
  <rect x="216" y="240" width="238" height="60" rx="10" class="box"/>
  <text x="232" y="278" class="code">jest</text>

  <g class="c1">
    <circle cx="430" cy="110" r="14" fill="#34d399"/>
    <path d="M 423 110 L 428 115 L 437 105" class="chk"/>
  </g>
  <g class="c2">
    <circle cx="430" cy="190" r="14" fill="#34d399"/>
    <path d="M 423 190 L 428 195 L 437 185" class="chk"/>
  </g>
  <g class="c3">
    <circle cx="430" cy="270" r="14" fill="#34d399"/>
    <path d="M 423 270 L 428 275 L 437 265" class="chk"/>
    <path d="M 474 180 L 498 180" class="lok"/>
    <rect x="506" y="132" width="190" height="96" rx="12" class="okb"/>
    <text x="601" y="172" text-anchor="middle" class="ok">visto verde</text>
    <text x="601" y="206" text-anchor="middle" class="m">todos passaram</text>
  </g>

  <!-- a alternativa -->
  <rect x="506" y="240" width="190" height="80" rx="12" class="nob"/>
  <text x="601" y="273" text-anchor="middle" class="no">X vermelho</text>
  <text x="601" y="304" text-anchor="middle" class="m">algum falhou</text>
</svg>
