<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Inter, system-ui, sans-serif">
  <title>A mesma página em três camadas: só HTML dá a estrutura, o CSS acrescenta a aparência e o JavaScript faz o botão reagir ao clique</title>
  <style>
    .box  { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .bar  { fill: #2a3a5c; }
    .hd   { fill: #e8edf7; font-size: 24px; font-weight: 700; }
    .sub  { fill: #b4bfd3; font-size: 22px; }
    .h1a  { fill: #e8edf7; font-size: 22px; font-weight: 700; }
    .h1b  { fill: #34d399; font-size: 22px; font-weight: 700; }
    .btn0 { fill: #2a3a5c; stroke: #b4bfd3; stroke-width: 1.5; }
    .bt0  { fill: #e8edf7; font-size: 22px; }
    .btn  { fill: #34d399; }
    .bt   { fill: #06281c; font-size: 22px; font-weight: 600; }
    .cap  { fill: #b4bfd3; font-size: 22px; }
    .alert { fill: #0b1020; stroke: #fbbf24; stroke-width: 2; }
    .at   { fill: #e8edf7; font-size: 22px; font-weight: 700; }
  </style>
  <rect width="720" height="380" rx="16" fill="#0b1020"/>

  <!-- 1: só HTML -->
  <text class="hd" x="127" y="44" text-anchor="middle">HTML</text>
  <text class="sub" x="127" y="72" text-anchor="middle">estrutura</text>
  <rect class="box" x="16" y="88" width="222" height="272" rx="12"/>
  <text class="h1a" x="32" y="128">Minhas Tarefas</text>
  <rect class="bar" x="32" y="148" width="170" height="12" rx="6"/>
  <rect class="bar" x="32" y="172" width="130" height="12" rx="6"/>
  <rect class="btn0" x="32" y="204" width="190" height="42" rx="3"/>
  <text class="bt0" x="127" y="232" text-anchor="middle">Adicionar tarefa</text>
  <text class="cap" x="127" y="300" text-anchor="middle">sem cor</text>
  <text class="cap" x="127" y="330" text-anchor="middle">nem estilo</text>

  <!-- 2: + CSS -->
  <text class="hd" x="359" y="44" text-anchor="middle">+ CSS</text>
  <text class="sub" x="359" y="72" text-anchor="middle">aparência</text>
  <rect class="box" x="248" y="88" width="222" height="272" rx="12"/>
  <text class="h1b" x="264" y="128">Minhas Tarefas</text>
  <rect class="bar" x="264" y="148" width="170" height="12" rx="6"/>
  <rect class="bar" x="264" y="172" width="130" height="12" rx="6"/>
  <rect class="btn" x="264" y="204" width="190" height="42" rx="12"/>
  <text class="bt" x="359" y="232" text-anchor="middle">Adicionar tarefa</text>
  <text class="cap" x="359" y="300" text-anchor="middle">bonito,</text>
  <text class="cap" x="359" y="330" text-anchor="middle">mas parado</text>

  <!-- 3: + JavaScript -->
  <text class="hd" x="591" y="44" text-anchor="middle">+ JavaScript</text>
  <text class="sub" x="591" y="72" text-anchor="middle">comportamento</text>
  <rect class="box" x="480" y="88" width="222" height="272" rx="12"/>
  <text class="h1b" x="496" y="128">Minhas Tarefas</text>
  <rect class="bar" x="496" y="148" width="170" height="12" rx="6"/>
  <rect class="bar" x="496" y="172" width="130" height="12" rx="6"/>
  <rect class="btn" x="496" y="204" width="190" height="42" rx="12"/>
  <text class="bt" x="591" y="232" text-anchor="middle">Adicionar tarefa</text>
  <g transform="translate(656 240) scale(1.4)" fill="#0b1020" stroke="#e8edf7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 4.1 12 6"/>
    <path d="m5.1 8-2.9-.8"/>
    <path d="m6 12-1.9 2"/>
    <path d="M7.2 2.2 8 5.1"/>
    <path d="M9.037 9.69a.498.498 0 0 1 .653-.653l11 4.5a.5.5 0 0 1-.074.949l-4.349 1.041a1 1 0 0 0-.74.739l-1.04 4.35a.5.5 0 0 1-.95.074z"/>
  </g>
  <rect class="alert" x="496" y="284" width="190" height="58" rx="8"/>
  <text class="at" x="591" y="321" text-anchor="middle">Nova tarefa!</text>
</svg>
