<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Inter, system-ui, sans-serif">
  <title>Cada compra passa por montarCarrinho, fecharPedido (síncrono) e await finalizarCompra (assíncrono) até Meus pedidos; um erro esperado lançado ou rejeitado cai no catch</title>
  <style>
    .box  { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .ok   { fill: #131c33; stroke: #34d399; stroke-width: 2; }
    .err  { fill: #131c33; stroke: #f87171; stroke-width: 2; stroke-dasharray: 8 6; }
    .c    { fill: #e8edf7; font-size: 22px; font-weight: 700; font-family: 'JetBrains Mono', Consolas, monospace; }
    .n    { fill: #e8edf7; font-size: 22px; font-weight: 700; }
    .m    { fill: #b4bfd3; font-size: 22px; }
    .ce   { fill: #f87171; font-size: 22px; font-weight: 700; font-family: 'JetBrains Mono', Consolas, monospace; }
    .lbl  { fill: #f87171; font-size: 22px; font-weight: 700; }
    .line { stroke: #a78bfa; stroke-width: 2.5; fill: none; marker-end: url(#seta); }
    .falha { stroke: #f87171; stroke-width: 2.5; fill: none; stroke-dasharray: 8 6; marker-end: url(#seta-erro); }
    .p1 { animation: p1 8s infinite; }
    .p2 { animation: p2 8s infinite; }
    .p3 { animation: p3 8s infinite; }
    @keyframes p1 { 0%, 8% { opacity: 0; transform: translateY(-8px); } 18%, 100% { opacity: 1; transform: translateY(0); } }
    @keyframes p2 { 0%, 28% { opacity: 0; transform: translateY(-8px); } 38%, 100% { opacity: 1; transform: translateY(0); } }
    @keyframes p3 { 0%, 48% { opacity: 0; transform: translateY(-8px); } 58%, 100% { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .p1, .p2, .p3 { animation: none; } }
  </style>
  <defs>
    <marker id="seta" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#a78bfa"/></marker>
    <marker id="seta-erro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f87171"/></marker>
  </defs>
  <rect width="720" height="420" rx="16" fill="#0b1020"/>

  <!-- carrinho -->
  <rect class="box" x="24" y="20" width="340" height="72" rx="10"/>
  <text class="c" x="44" y="50">montarCarrinho</text>
  <text class="m" x="44" y="80">itens com preço e qtd</text>

  <!-- fecharPedido -->
  <g class="p1">
    <path class="line" d="M194 94 L194 116"/>
    <rect class="box" x="24" y="120" width="340" height="72" rx="10"/>
    <text class="c" x="44" y="150">fecharPedido</text>
    <text class="m" x="44" y="180">síncrono: estoque, cupom, CEP</text>
  </g>

  <!-- finalizarCompra -->
  <g class="p2">
    <path class="line" d="M194 194 L194 216"/>
    <rect class="box" x="24" y="220" width="340" height="72" rx="10"/>
    <text class="c" x="44" y="250">await finalizarCompra</text>
    <text class="m" x="44" y="280">assíncrono: 4 etapas</text>
  </g>

  <!-- Meus pedidos -->
  <g class="p3">
    <path class="line" d="M194 294 L194 316"/>
    <rect class="ok" x="24" y="320" width="340" height="72" rx="10"/>
    <text class="n" x="44" y="350">Meus pedidos</text>
    <text class="m" x="44" y="380">só o pedido confirmado</text>
  </g>

  <!-- catch -->
  <path class="falha" d="M366 156 L462 196"/>
  <text class="lbl" x="372" y="146">lança</text>
  <path class="falha" d="M366 256 L462 246"/>
  <text class="lbl" x="376" y="292">rejeita</text>
  <rect class="err" x="470" y="150" width="226" height="150" rx="10"/>
  <text class="ce" x="490" y="184">catch</text>
  <text class="m" x="490" y="216">esperado: imprime</text>
  <text class="m" x="490" y="246">a message</text>
  <text class="m" x="490" y="280">bug: relança</text>
</svg>
