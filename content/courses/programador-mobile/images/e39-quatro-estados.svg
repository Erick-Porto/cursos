<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Inter, system-ui, sans-serif">
  <title>Os 4 estados do Início: carregar começa no carregando; depois de 1,5 s a tela vai para conteúdo, vazio ou erro, e do erro o Tentar novamente volta ao carregando</title>
  <style>
    .t    { fill: #e8edf7; font-size: 24px; font-weight: 700; }
    .m    { fill: #b4bfd3; font-size: 22px; }
    .lbl  { fill: #a78bfa; font-size: 22px; font-weight: 700; }
    .code { fill: #a78bfa; font-size: 22px; font-family: 'JetBrains Mono', Consolas, monospace; }
    .box  { fill: #131c33; stroke-width: 2; }
    .seta { stroke: #a78bfa; stroke-width: 2.5; fill: none; marker-end: url(#ponta); }
    .volta { stroke: #fbbf24; stroke-width: 2.5; fill: none; stroke-dasharray: 8 5; marker-end: url(#ponta-volta); }
  </style>
  <defs>
    <marker id="ponta" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#a78bfa"/></marker>
    <marker id="ponta-volta" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#fbbf24"/></marker>
  </defs>
  <rect width="720" height="400" rx="16" fill="#0b1020"/>

  <!-- entrada -->
  <text class="code" x="126" y="112" text-anchor="middle">carregar()</text>
  <path class="seta" d="M126 120 V144"/>

  <!-- carregando -->
  <rect class="box" x="20" y="150" width="212" height="96" rx="12" stroke="#b4bfd3"/>
  <text class="t" x="126" y="190" text-anchor="middle">Carregando</text>
  <text class="m" x="126" y="224" text-anchor="middle">esqueleto, 1,5 s</text>

  <!-- caminhos depois da espera -->
  <path class="seta" d="M232 198 H468"/>
  <path class="seta" d="M270 198 V68 H468"/>
  <path class="seta" d="M270 198 V300 H468"/>
  <text class="lbl" x="284" y="56">com produtos</text>
  <text class="lbl" x="284" y="186">lista vazia</text>
  <text class="lbl" x="284" y="288">falhou, 3 em 10</text>

  <!-- destinos -->
  <rect class="box" x="476" y="24" width="220" height="88" rx="12" stroke="#34d399"/>
  <text class="t" x="586" y="62" text-anchor="middle">Conteúdo</text>
  <text class="m" x="586" y="94" text-anchor="middle">grade de produtos</text>

  <rect class="box" x="476" y="154" width="220" height="88" rx="12" stroke="#60a5fa"/>
  <text class="t" x="586" y="192" text-anchor="middle">Vazio</text>
  <text class="m" x="586" y="224" text-anchor="middle">mensagem e ação</text>

  <rect class="box" x="476" y="270" width="220" height="100" rx="12" stroke="#f87171" stroke-dasharray="8 5"/>
  <text class="t" x="586" y="312" text-anchor="middle">Erro</text>
  <text class="m" x="586" y="344" text-anchor="middle">o que houve</text>

  <!-- nova tentativa -->
  <path class="volta" d="M476 346 H126 V252"/>
  <text x="146" y="380" font-size="22" font-weight="700" fill="#fbbf24">Tentar novamente</text>
</svg>
