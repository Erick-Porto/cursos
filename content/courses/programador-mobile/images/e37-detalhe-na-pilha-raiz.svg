<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Inter, system-ui, sans-serif">
  <title>A aba Categorias chama router.push('/produto/3'); quem conhece a rota é a pilha raiz, e o Detalhe entra por cima do grupo (tabs) inteiro</title>
  <style>
    .raiz  { fill: none; stroke: #a78bfa; stroke-width: 2; stroke-dasharray: 8 6; }
    .abas  { fill: none; stroke: #60a5fa; stroke-width: 2; stroke-dasharray: 8 6; }
    .box   { fill: #131c33; stroke: #2a3a5c; stroke-width: 1.5; }
    .dest  { fill: #131c33; stroke: #34d399; stroke-width: 2.5; }
    .ring  { fill: none; stroke: #34d399; stroke-width: 3; }
    .t     { fill: #e8edf7; font-size: 22px; font-weight: 700; }
    .m     { fill: #b4bfd3; font-size: 22px; }
    .code  { font-size: 22px; font-weight: 700; font-family: 'JetBrains Mono', Consolas, monospace; }
    .lbl   { fill: #a78bfa; font-size: 22px; font-weight: 700; }
    .line  { stroke: #a78bfa; stroke-width: 3; fill: none; marker-end: url(#seta); }
    .toque   { animation: toque 8s ease-out infinite; }
    .push    { animation: push 8s ease-out infinite; }
    .detalhe { animation: detalhe 8s ease-out infinite; }
    @keyframes toque {
      0%, 6%   { opacity: 0; }
      14%, 92% { opacity: 1; }
      100%     { opacity: 0; }
    }
    @keyframes push {
      0%, 20%  { opacity: 0; transform: translateY(10px); }
      34%, 92% { opacity: 1; transform: translateY(0); }
      100%     { opacity: 0; transform: translateY(0); }
    }
    @keyframes detalhe {
      0%, 40%  { opacity: 0; transform: translateX(30px); }
      54%, 92% { opacity: 1; transform: translateX(0); }
      100%     { opacity: 0; transform: translateX(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .toque, .push, .detalhe { animation: none; }
    }
  </style>
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
  </defs>
  <rect width="720" height="400" rx="16" fill="#0b1020"/>

  <!-- pilha raiz: app/_layout.js -->
  <rect class="raiz" x="16" y="16" width="688" height="368" rx="14"/>
  <text class="lbl" x="36" y="54">pilha raiz</text>

  <!-- grupo (tabs) com as quatro abas -->
  <rect class="abas" x="36" y="150" width="368" height="214" rx="12"/>
  <text class="code" x="56" y="188" fill="#60a5fa">(tabs)</text>
  <rect class="box" x="56" y="206" width="160" height="50" rx="10"/>
  <text class="t" x="136" y="239" text-anchor="middle">Início</text>
  <rect class="box" x="228" y="206" width="160" height="50" rx="10"/>
  <text class="t" x="308" y="239" text-anchor="middle">Categorias</text>
  <rect class="box" x="56" y="272" width="160" height="50" rx="10"/>
  <text class="t" x="136" y="305" text-anchor="middle">Carrinho</text>
  <rect class="box" x="228" y="272" width="160" height="50" rx="10"/>
  <text class="t" x="308" y="305" text-anchor="middle">Perfil</text>

  <!-- 1. o toque na aba Categorias -->
  <rect class="ring toque" x="222" y="200" width="172" height="62" rx="13"/>

  <!-- 2. push sobe até a pilha raiz -->
  <g class="push">
    <path class="line" d="M 308 198 L 308 124 L 564 124 L 564 144"/>
    <text class="code" x="436" y="108" text-anchor="middle" fill="#a78bfa">router.push('/produto/3')</text>
  </g>

  <!-- 3. o Detalhe entra por cima das abas -->
  <g class="detalhe">
    <rect class="dest" x="440" y="150" width="248" height="214" rx="12"/>
    <text class="code" x="460" y="188" fill="#e8edf7">produto/[id]</text>
    <text class="t" x="564" y="246" text-anchor="middle">Detalhe</text>
    <text class="m" x="564" y="290" text-anchor="middle">por cima de</text>
    <text class="m" x="564" y="322" text-anchor="middle">todas as abas</text>
  </g>
</svg>
