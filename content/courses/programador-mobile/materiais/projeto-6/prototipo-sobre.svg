<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" font-family="Inter, system-ui, sans-serif">
  <title>Protótipo da tela Sobre do Casas de adoção, com as medidas: ícone de 72, nome 16 abaixo, frase 4 abaixo, cartão de números 24 abaixo, seção Como funciona 24 abaixo com linhas de 56, botão de tema 32 abaixo e rodapé 16 abaixo</title>
  <style>
    .nota  { fill: #e8edf7; font-size: 22px; }
    .num   { fill: #a78bfa; font-weight: 700; }
    .guia  { stroke: #a78bfa; stroke-width: 2; fill: none; }
    .ponto { fill: #a78bfa; }
    .txt   { fill: #0f172a; font-size: 22px; }
    .suave { fill: #475569; font-size: 22px; }
    .ico   { fill: none; stroke: #0f766e; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="720" height="660" rx="16" fill="#0b1020"/>

  <!-- frame do protótipo, tema claro (fundo, superfície, borda, texto, texto suave e primária) -->
  <rect x="40" y="16" width="300" height="628" rx="28" fill="#f1f5f9" stroke="#b4bfd3" stroke-width="2"/>

  <!-- topo: ícone com a pata, nome e frase -->
  <circle cx="190" cy="76" r="36" fill="#0f766e"/>
  <ellipse cx="190" cy="88" rx="12" ry="10" fill="#ffffff"/>
  <circle cx="175" cy="72" r="5" fill="#ffffff"/>
  <circle cx="184" cy="63" r="5" fill="#ffffff"/>
  <circle cx="196" cy="63" r="5" fill="#ffffff"/>
  <circle cx="205" cy="72" r="5" fill="#ffffff"/>
  <text x="190" y="150" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Casas de adoção</text>
  <text class="suave" x="190" y="180" text-anchor="middle">Adote perto de você</text>

  <!-- cartão com três números de mesma largura -->
  <rect x="56" y="204" width="268" height="88" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="101" y="242" text-anchor="middle" font-size="26" font-weight="700" fill="#0f766e">12</text>
  <text x="190" y="242" text-anchor="middle" font-size="26" font-weight="700" fill="#0f766e">5</text>
  <text x="279" y="242" text-anchor="middle" font-size="26" font-weight="700" fill="#0f766e">76</text>
  <text class="suave" x="101" y="274" text-anchor="middle">casas</text>
  <text class="suave" x="190" y="274" text-anchor="middle">cidades</text>
  <text class="suave" x="279" y="274" text-anchor="middle">vagas</text>

  <!-- seção Como funciona: cartão com três linhas -->
  <text x="56" y="332" font-size="22" font-weight="700" fill="#0f172a">Como funciona</text>
  <rect x="56" y="348" width="268" height="168" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <path d="M56 404 H324 M56 460 H324" stroke="#e2e8f0" stroke-width="1.5"/>
  <g class="ico"><circle cx="78" cy="374" r="7"/><path d="M83 379 l6 6"/></g>
  <g class="ico"><rect x="69" y="422" width="18" height="17" rx="3"/><path d="M69 428 H87 M74 419 v6 M82 419 v6"/></g>
  <g class="ico"><circle cx="78" cy="488" r="9"/><path d="M78 483 v10 M73 488 h10"/></g>
  <text class="txt" x="100" y="384">Busque a cidade</text>
  <text class="txt" x="100" y="440">Marque a visita</text>
  <text class="txt" x="100" y="496">Cadastre a casa</text>

  <!-- botão secundário de tema e rodapé -->
  <rect x="56" y="548" width="268" height="44" rx="12" fill="none" stroke="#0f766e" stroke-width="2"/>
  <path class="ico" d="M112 562 a9 9 0 1 0 10 12 a7 7 0 0 1 -10 -12 z"/>
  <text x="206" y="577" text-anchor="middle" font-size="22" font-weight="700" fill="#0f766e">Tema escuro</text>
  <text class="suave" x="190" y="628" text-anchor="middle">Dados fictícios</text>

  <!-- medidas -->
  <path class="guia" d="M226 76 H362 M290 142 H362 M296 172 H362 M324 204 H362 M216 324 H362 M332 406 V458 M332 432 H362 M324 548 H362 M270 620 H362"/>
  <circle class="ponto" cx="226" cy="76" r="4"/>
  <circle class="ponto" cx="290" cy="142" r="4"/>
  <circle class="ponto" cx="296" cy="172" r="4"/>
  <circle class="ponto" cx="324" cy="204" r="4"/>
  <circle class="ponto" cx="216" cy="324" r="4"/>
  <circle class="ponto" cx="324" cy="548" r="4"/>
  <circle class="ponto" cx="270" cy="620" r="4"/>
  <text class="nota" x="372" y="84">ícone <tspan class="num">72 × 72</tspan></text>
  <text class="nota" x="372" y="150">nome <tspan class="num">16</tspan> abaixo</text>
  <text class="nota" x="372" y="180">frase <tspan class="num">4</tspan> abaixo</text>
  <text class="nota" x="372" y="212">números <tspan class="num">24</tspan> abaixo</text>
  <text class="nota" x="372" y="244">3 colunas iguais</text>
  <text class="nota" x="372" y="332">seção <tspan class="num">24</tspan> abaixo</text>
  <text class="nota" x="372" y="440">linhas de <tspan class="num">56</tspan></text>
  <text class="nota" x="372" y="556">botão <tspan class="num">32</tspan> abaixo</text>
  <text class="nota" x="372" y="628">rodapé <tspan class="num">16</tspan> abaixo</text>
</svg>
