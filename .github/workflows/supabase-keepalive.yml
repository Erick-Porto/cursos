name: Manter Supabase ativo

# O plano gratuito do Supabase pausa o projeto depois de 7 dias sem uso.
# Esta tarefa faz uma consulta leve ao banco a cada 3 dias para evitar isso.
# Se ela falhar (projeto já pausado, chave errada), o GitHub avisa por e-mail.

on:
  schedule:
    - cron: '0 12 */3 * *' # 09:00 em Brasília, a cada 3 dias
  workflow_dispatch:

permissions:
  actions: write # para manter o próprio agendamento ligado (último passo)

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar o banco
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Cadastre VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY em Settings > Secrets and variables > Actions."
            exit 1
          fi
          # Uma leitura simples passa pelo Postgres, o que conta como atividade.
          # Com a anon key o RLS devolve lista vazia; o que importa é o HTTP 200.
          code=$(curl -sS -o resposta.json -w '%{http_code}' --retry 3 --retry-delay 10 \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/courses?select=id&limit=1") || true
          echo "HTTP $code"
          if [ "$code" != 200 ]; then
            cat resposta.json 2>/dev/null || true
            echo "::error::O Supabase não respondeu (HTTP $code). O projeto pode estar pausado: confira no painel."
            exit 1
          fi

      # Em repositórios públicos o GitHub desliga tarefas agendadas depois de
      # 60 dias sem commits. Reativar o workflow pela API evita o desligamento.
      - name: Manter o agendamento ligado
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
